};

/* What this page believes is on file. undefined means it does not carry that
   measure at all, which is a different answer from "blank" and is shown as one.
   A game he has no line in is not "not carried": it is on file as nothing,
   and null says so. */
function corrCurrent(){
  var c = STATE.corr;
  if (!c || !c.field) return undefined;

  if (c.gameId){
    if (!GAME_KEY[c.field]) return undefined;
    var lines = (STATE.mine.gameLog||[]).filter(function(r){ return r.gameId === c.gameId; });
    if (!lines.length) return null;
    var total = null;
    lines.forEach(function(r){
      var v = r[GAME_KEY[c.field]];
      if (v === null || v === undefined || v === '') return;
      total = (total === null ? 0 : total) + Number(v);
    });
    return total;
  }

  if (!SEASON_KEY[c.field]) return undefined;
  var row = (STATE.mine.seasonStats||[]).filter(function(r){ return r.seasonId === c.seasonId; })[0];
  if (!row) return null;
  var v = row[SEASON_KEY[c.field]];
  return (v === null || v === undefined || v === '') ? null : v;
}

function renderCorrForm(){
  var card = document.getElementById('corrCard');
  if (!card) return;
  var c = STATE.corr;

  if (!c){
    var none = !((STATE.mine||{}).seasonStats||[]).length && !((STATE.mine||{}).gameLog||[]).length;
    card.innerHTML = '<h2>Request a correction</h2>'
      + '<div class="sub">'
      + (none
          ? 'Nothing of yours is on file yet. If you played and your line is missing, press '
            + '<b>Request a correction</b>, pick the game and say what the number should be'
            + ((STATE.prof && STATE.prof.editable && STATE.prof.editable.hasCurrentSeason)
                ? ' — or enter the whole line under <b>Enter your stats</b> above.' : '.')
          : 'Press <b>Correct a number</b> beside a row above, or <b>Request a correction</b> '
            + 'for a game or a season total that has no line yet.')
      + ' Nothing you send changes a published figure: your coach or an administrator '
      + 'decides, and the number moves only if he agrees.</div>'
      + '<div class="row" style="margin-top:12px"><button type="button" class="mini primary" '
      + 'data-a="corrOpenAny">Request a correction</button></div>';
    return;
  }

  var places = corrPlaces(c.seasonId);
  var here = places.filter(function(p){ return p.id === (c.gameId||''); })[0];
  var where = here ? here.label
            : (c.gameId ? (c.seasonId + ' · ' + c.gameId) : (c.seasonId + ' · season total'));
  if (!here) places.push({ id: c.gameId, label: where });

  var cur = corrCurrent();
  var curHtml = (cur === undefined)
    ? '<span class="blank">this page does not carry that number - your coach will see the '
      + 'value on file</span>'
    : orBlank(cur);

  card.innerHTML = '<h2>Request a correction</h2>'
    + '<div class="form">'
    + '<div class="wide"><label class="f">Where</label><select data-h="corrWhere">'
    + places.map(function(p){
        return '<option value="'+esc(p.id)+'"'+(p.id===(c.gameId||'')?' selected':'')+'>'
             + esc(p.label)+'</option>'; }).join('')
    + '</select></div>'
    + '<div><label class="f">Which stat</label><select data-h="corrField">'
    + '<option value="">Choose...</option>'
    + ((STATE.prof && STATE.prof.editable.correctableFields) || []).map(function(f){
        return '<option value="'+esc(f)+'"'+(f===c.field?' selected':'')+'>'
             + esc(fieldLong(f))+'</option>'; }).join('')
    + '</select></div>'
    + '<div><label class="f">On file now</label>'
    + '<div style="padding:7px 0">'+curHtml+'</div></div>'
    + '<div><label class="f">It should be</label>'
    + '<input type="number" step="0.5" data-h="corrVal" value="'+esc(c.proposed)+'">'
    + '<div class="hint">Leave it empty to say the number should not be there at all - that '
    + 'it was never reported. That is a different claim from zero, and both are allowed.</div>'
    + '</div>'
    + '<div class="wide"><label class="f">What happened</label>'
    + '<textarea data-h="corrWhy" placeholder="I had 6 catches against Elkton, not 4 - the '
    + 'two in the fourth quarter went to the wrong number.">'+esc(c.reason)+'</textarea>'
    + '<div class="hint" id="corrWhyCount">At least 12 characters. A coach has to be able to '
    + 'check it.</div></div></div>'
    + '<div class="row end" style="margin-top:12px">'
    + '<span class="sub grow" id="corrMsg"></span>'
    + '<button type="button" class="mini" data-a="corrCancel">Cancel</button>'
    + '<button type="button" class="mini primary" data-a="corrSend">Send request</button></div>';
}

INP.corrField = function(el){
  if (!STATE.corr || STATE.corr.field === el.value) return;
  STATE.corr.field = el.value;
  renderCorrForm();
};
INP.corrVal = function(el){ if (STATE.corr) STATE.corr.proposed = readText(el); };
INP.corrWhy = function(el){
  if (!STATE.corr) return;
  STATE.corr.reason = el.value;
  var c = document.getElementById('corrWhyCount');
  if (!c) return;
  var n = el.value.trim().length;
  c.textContent = n < 12
    ? (12 - n) + ' more characters. A coach has to be able to check it.'
    : 'Long enough.';
  c.className = 'hint' + (n < 12 ? ' warnc' : '');
};

function corrSay(text, kind){
  var m = document.getElementById('corrMsg');
  if (m){ m.textContent = text; m.className = 'sub grow' + (kind ? ' ' + kind : ''); }
}

ACT.corrSend = function(el){
  var c = STATE.corr;
  if (!c) return;
  if (!c.field){ corrSay('Choose which stat is wrong.', 'err'); return; }
  if (c.reason.trim().length < 12){
    corrSay('Say what happened, in at least 12 characters.', 'err');
    return;
  }

  var payload = {
    seasonId: c.seasonId,
    gameId: c.gameId || null,
    field: c.field,
    // '' is a real proposal: "this was never reported" is a different and often
    // truer claim than "this was zero".
    proposedValue: c.proposed,
    reason: c.reason
  };
  // What this page believes is on file, sent only when it knows. The server
  // reads the sheet either way and tells the reviewer when the two disagree -
  // usually a cached page, and worth his knowing.
  var cur = corrCurrent();
  if (cur !== undefined) payload.currentValue = (cur === null ? '' : cur);

  el.disabled = true;
  corrSay('Sending...', '');
  call('svcRequestCorrection', [payload]).then(function(r){
    STATE.corr = null;
    STATE.corrections = null;
    noticeBox('ok', '<b>Request '+esc(r.correctionId)+' filed.</b> Your coach and the '
      + 'conference administrators have been told. Nothing on the site has changed.');
    viewMyStats();
  }).catch(function(e){
    el.disabled = false;
    corrSay(msgOf(e), 'err');
  });
};

/* -
   DASHBOARD - the first page
   An administrator: what is waiting for a decision, and which schools have
   sent which stats for which week. A coach: what is waiting, the season at
   a glance - standing, record, last and next game, roster - the players
   tracking for All-Conference, and every conference top five the school
   holds. The tools are the tabs beside it.
   - */

function viewFanDashboard(){
  barHide(); alertBox('', '');
  var a=STATE.auth||{}, base=String(STATE.boot&&STATE.boot.portalUrl||POLICY_EXEC_URL||'').split('?')[0];
  var h='<div class="card"><h2>Your fan account</h2><p>Welcome, '+esc(a.name||'UCBAC fan')+'.</p>'+
    '<p class="sub">Your fan account does not create a public player or coach profile.</p>';
  if(a.canUseBlitz===true) h+='<p>Ask Blitz about UCBAC football, or explore the daily Players and Teams stories on Home.</p>'+
    '<div class="row fan-actions"><a class="primary" href="'+esc(base)+'#/ask" target="_top">Open Blitz AI</a>'+
    '<a class="mini" href="'+esc(base)+'#/" target="_top">Read daily summaries</a></div>';
  else h+='<p>Browse scores, team standings and player statistics.</p>'+
    '<div class="fan-actions"><a class="primary" href="'+esc(base)+'#/" target="_top">Explore UCBAC Stats</a></div>';
  h+='<p class="sub" style="margin-top:18px">For account help or to correct your details, email '+
    '<a href="mailto:contact@example.invalid">contact@example.invalid</a>.</p></div>';
  paint(h);
}

function viewDashboard(){
  if(STATE.auth&&STATE.auth.isFan){viewFanDashboard();return;}
  var isCurrent=portalViewCurrent();
  paintLoading('Loading dashboard',5);
  barHide();
  alertBox('', '');
  var a = STATE.auth || {};
  var admin = !!a.isAdmin;
  // a player who is neither a coach nor an administrator gets his own
  if (!admin && !a.isCoach && a.playerId){ viewPlayerDashboard(); return; }
  var season = STATE.seasonId;
  var quiet = function(p, fallback){ return p.catch(function(){if(!isCurrent())return; return fallback; }); };
  Promise.all(admin ? [
    quiet(call('svcAuthState'), null),
    quiet(call('svcPendingAccounts'), { pending: [], totals: null }),
    call('svcStatsTracker', [season]).catch(function(e){if(!isCurrent())return; return { error: msgOf(e) }; }),
    quiet(call('svcPlaysInfo', ['']), null)
  ] : [
    quiet(call('svcAuthState'), null),
    Promise.resolve(null),
    quiet(loadTeamAdmin(), null),                       // games, roster - the same load Scores and Roster use
    quiet(call('svcPlaysInfo', ['']), null),
    quiet(call('svcStandings', [season]), []),
    quiet(call('svcAllConference', [season]), null),
    quiet(call('svcLeaders', [season]), [])
  ]).then(function(r){if(!isCurrent())return;
    if (STATE.view !== 'dashboard') return;          // moved on while it loaded
    if (r[0]){ STATE.auth = r[0]; renderWho(); renderTabs(); }
    if (admin){
      STATE.acctTotals = (r[1] && r[1].totals) || null;
      STATE.tracker = r[2];
      STATE.scovPatch = {};
      paint(dashTiles(r[3]) + dashTracker(r[2]));
      /* The tracker is the only thing on this page anybody edits, so the bar
         belongs to it. Nothing to save until a box is clicked. */
      if (r[2] && r[2].isAdmin && !r[2].error)
        barShow({ label:'Save stats received', save:saveScov, reset:function(){
          STATE.scovPatch = {}; clearDirty(); viewDashboard(); } });
      return;
    }
    paint(dashTiles(r[3]) + dashSeason(r[2], r[4])
      + '<div class="dash-two">' + dashAC(r[5]) + dashTopFive(r[6]) + '</div>');
  }).catch(function(e){if(!isCurrent())return;
    alertBox('bad', esc(msgOf(e)));
    paint('<div class="card sub">Unavailable.</div>');
  });
}

/* A player's dashboard: his profile and his line, his corrections, the
   Top 10 window, his team's season, and where he stands in the projection
   and on the leader boards. Everything comes from the public reads and his
   own profile - a player holds no team tool. */
function viewPlayerDashboard(){
  var isCurrent=portalViewCurrent();
  var season = STATE.seasonId, pid = STATE.auth.playerId;
  var quiet = function(p, fallback){ return p.catch(function(){if(!isCurrent())return; return fallback; }); };
  Promise.all([
    quiet(call('svcAuthState'), null),
    quiet(loadProfile(), null),
    quiet(STATE.mine ? Promise.resolve(STATE.mine)
                     : call('svcPlayer', [pid]).then(function(p){if(!isCurrent())return; STATE.mine = p; return p; }), null),
    quiet(call('svcStandings', [season]), []),
    quiet(call('svcAllConference', [season]), null),
    quiet(call('svcLeaders', [season]), []),
    quiet(call('svcMyCorrections'), []),
    quiet(call('svcPlaysInfo', ['']), null)
  ]).then(function(r){if(!isCurrent())return;
    if (STATE.view !== 'dashboard') return;
    if (r[0]){ STATE.auth = r[0]; renderWho(); renderTabs(); }
    var prof = r[1], cur = null;
    if (prof) cur = (prof.seasons || []).filter(function(x){ return x.seasonId === prof.editable.seasonId; })[0] || null;
    var tid = (cur && cur.teamId) || STATE.auth.teamId || '';
    STATE.corrections = r[6] || [];
    // his team's schedule - the public read - for the last game and the next
    var team = !tid ? Promise.resolve(null)
      : (STATE.myTeam && STATE.myTeam.team === tid && STATE.myTeam.seasonId === season)
        ? Promise.resolve(STATE.myTeam)
        : quiet(call('svcTeam', [tid, season]).then(function(t){if(!isCurrent())return; if (t) t.seasonId = season; STATE.myTeam = t; return t; }), null);
    return team.then(function(t){if(!isCurrent())return;
      if (STATE.view !== 'dashboard') return;
      paint(dashPlayerTiles(prof, cur, r[2], r[6] || [], r[7])
        + dashSeason(dashTeamGames(t, tid), r[3], tid)
        + '<div class="dash-two">' + dashAC(r[4], pid) + dashTopFive(r[5], pid) + '</div>');
    });
  }).catch(function(e){if(!isCurrent())return;
    alertBox('bad', esc(msgOf(e)));
    paint('<div class="card sub">Unavailable.</div>');
  });
}

/* the public team read, reshaped into the games the season tiles expect */
function dashTeamGames(t, tid){
  if (!t || !t.games) return null;
  return { games: t.games.map(function(g){
    var home = g.home === tid;
    return { week: g.week, isHome: home, date: g.date,
             opponentName: (home ? g.awayName : g.homeName) || tnameOf(home ? g.away : g.home),
             teamScore: home ? g.hs : g.as, opponentScore: home ? g.as : g.hs };
  }) };
}

/* what a player's tiles say: his profile, his line, his corrections, Top 10 */
function dashPlayerTiles(prof, cur, mine, corr, pi){
  var season = STATE.seasonId;
  var h = '<div class="dash-tiles">';
  // the profile: what is filled in this season, and what is not
  if (!prof)
    h += dashTile('', 'My profile', 'Unavailable', 'Try again in a moment', 'profile');
  else if (!cur)
    h += dashTile('hot', 'My profile', 'Not on a roster', 'Your coach adds you to the '+esc(snameOf(season))+' roster', 'profile');
  else {
    var filled = function(v){ return v !== null && v !== undefined && v !== ''; };
    var checks = [['height', filled(cur.heightInches)], ['weight', filled(cur.weightLbs)],
                  ['positions', !!(cur.positions && cur.positions.length)],
                  ['grad year', filled(prof.player.gradYear)], ['bio', filled(prof.player.bio)]];
    var missing = checks.filter(function(c){ return !c[1]; }).map(function(c){ return c[0]; });
    h += dashTile(missing.length ? 'hot' : 'calm', 'My profile',
                  (checks.length - missing.length)+' of '+checks.length,
                  missing.length ? 'Missing: '+esc(missing.join(', ')) : 'Complete - jersey, measurables and positions are in',
                  'profile');
  }
  // his line this season
  var log = ((mine && mine.gameLog) || []).filter(function(x){ return x.season === season; });
  var gameIds = {}; log.forEach(function(x){ gameIds[x.gameId || x.week] = 1; });
  var nGames = Object.keys(gameIds).length, grey = log.filter(function(x){ return x.prov; }).length;
  var ss = ((mine && mine.seasonStats) || []).filter(function(x){ return x.seasonId === season; })[0];
  h += dashTile('', 'My stats', nGames+' game'+(nGames === 1 ? '' : 's')+' logged',
                dashMyLine(ss) || (grey ? grey+' line'+(grey === 1 ? '' : 's')+' awaiting approval' : 'Enter a game on My Stats'),
                'mystats');
  // corrections he has filed
  var open = corr.filter(function(c){ return c.status === 'PENDING'; }).length;
  h += dashTile(open ? 'hot' : 'calm', 'Stat corrections', open,
                open ? 'Waiting on your coach' : (corr.length ? 'All decided' : 'None filed'), 'mystats');
  h += dashPlaysTile(pi);
  return h + '</div>';
}

/* the biggest thing on his season line, in five words: "412 passing yds" */
function dashMyLine(ss){
  if (!ss) return '';
  var n = function(v){ return Number(v || 0); };
  var picks = [[n(ss.passYds), 'passing yds'], [n(ss.rushYds), 'rushing yds'], [n(ss.recYds), 'receiving yds'],
               [n(ss.solo) + n(ss.asst), 'tackles'], [n(ss.sacks), 'sacks'], [n(ss.int), 'interceptions']]
    .filter(function(p){ return p[0] > 0; }).sort(function(a, b){ return b[0] - a[0]; });
  if (!picks.length) return '';
  return picks.slice(0, 2).map(function(p){ return p[0]+' '+p[1]; }).join(' · ')+(ss.prov ? ' · some awaiting approval' : '');
}

function dashTile(cls, head, n, sub, view){
  var inner = '<div class="tk-h">'+head+'</div><div class="tk-n">'+n+'</div><div class="tk-s">'+sub+'</div>';
  return view
    ? '<button type="button" class="tile '+cls+'" data-a="tab" data-v="'+view+'">'+inner+'</button>'
    : '<div class="tile '+cls+'">'+inner+'</div>';
}
function ordinal(n){
  n = Number(n); var r = n % 100;
  return n + ((r >= 11 && r <= 13) ? 'th' : ['th','st','nd','rd'][n % 10] || 'th');
}
function scored(g){
  var has = function(v){ return v !== null && v !== undefined && v !== ''; };
  return !!g && has(g.teamScore) && has(g.opponentScore);
}

/* the season at a glance: where the school stands, its record, the last
   game with a score, the next one, and the roster */
function dashSeason(d, standings, teamId){
  if (!d) return '';
  var tid = teamId || STATE.teamId, games = d.games || [];
  // the game tiles open Scores where there is a Scores tab; a player has none
  var sv = tabList().indexOf('scores') >= 0 ? 'scores' : '';
  var wk = function(g){ return g.week === null || g.week === undefined ? 99 : Number(g.week); };
  var played = games.filter(scored).sort(function(a, b){ return wk(b) - wk(a); });
  var w = 0, l = 0, t = 0, pf = 0, pa = 0;
  played.forEach(function(g){
    var us = Number(g.teamScore), them = Number(g.opponentScore);
    pf += us; pa += them; if (us > them) w++; else if (us < them) l++; else t++;
  });
  var rec = w+'-'+l+(t ? '-'+t : '');
  var st = (standings || []).filter(function(x){ return x.teamId === tid; })[0];
  var h = '<div class="dash-tiles">';
  if (st && st.rank)
    h += dashTile('', 'Conference rank', ordinal(st.rank)+(standings.length ? ' of '+standings.length : ''),
                  'Record '+st.w+'-'+st.l+(st.t ? '-'+st.t : '')+' · conference '+st.cw+'-'+st.cl
                  + (st.pf !== null && st.pa !== null ? ' · PF '+st.pf+' · PA '+st.pa : '')
                  + (st.move ? ' · '+(st.move > 0 ? 'up ' : 'down ')+Math.abs(st.move)+' since last week' : ''));
  else
    h += dashTile('', 'Record', rec, played.length ? 'PF '+pf+' · PA '+pa+' · standings not built yet' : 'No game played yet');
  var last = played[0];
  if (last){
    var us = Number(last.teamScore), them = Number(last.opponentScore);
    h += dashTile(us > them ? 'calm' : us < them ? 'hot' : '', 'Last game',
                  (us > them ? 'W ' : us < them ? 'L ' : 'T ')+us+'-'+them,
                  'Week '+(last.week === null ? '?' : esc(last.week))+' · '+(last.isHome ? 'vs ' : 'at ')+esc(last.opponentName), sv);
  }
  var next = games.filter(function(g){ return !scored(g); }).sort(function(a, b){ return wk(a) - wk(b); })[0];
  h += next
    ? dashTile('', 'Next game', (next.isHome ? 'vs ' : 'at ')+esc(next.opponentName),
               'Week '+(next.week === null ? '?' : esc(next.week))+(next.date ? ' · '+esc(dateShort(next.date)) : ''), sv)
    : dashTile('', 'Next game', 'None left', 'Every game has a score', sv);
  if (d.roster){
    var roster = d.roster, v = (STATE.boot && STATE.boot.verified) || {};
    var withAcct = roster.filter(function(p){ return v[p.playerId]; }).length;
    h += dashTile('', 'Roster', roster.length+' player'+(roster.length === 1 ? '' : 's'),
                  withAcct+' with an account · '+(roster.length - withAcct)+' without', 'roster');
  }
  return h + '</div>';
}

/* the school's players inside the All-Conference projection, by position -
   or, given a player id, that one player wherever he ranks */
function dashAC(ac, pid){
  var team = tnameOf(STATE.teamId);
  var h = '<div class="card"><h2>All-Conference tracking</h2>';
  if (!ac || !ac.positions) return h + '<div class="sub">The projection has not been built yet.</div></div>';
  var rows = [];
  ac.positions.forEach(function(p){
    (p.players || []).forEach(function(x){
      if (pid ? x.playerId !== pid : x.teamId !== STATE.teamId) return;
      rows.push({ pos: p.label, code: p.code, rank: x.rank, pool: p.poolSize, player: x.player,
                  tier: x.tier, status: x.status, thin: p.thin });
    });
  });
  if (!rows.length)
    return h + '<div class="sub">'+(pid ? 'You are not in the projection yet.' : 'No '+esc(team)+' player is in the projection yet.')
      + ' A player enters it once his stats clear the minimum for a position he is listed at.</div></div>';
  var chip = function(r){
    var tier = r.tier || '';
    var cls = /First/.test(tier) ? 'ok' : /Second/.test(tier) ? 'warn' : 'none';
    return '<span class="tk '+cls+'">'+esc(tier || 'Outside')+'</span>'
      + (r.status === 'Provisional' ? ' <span class="sub">provisional</span>' : '');
  };
  h += '<div class="sub" style="margin-bottom:10px">Live projection, rebuilt with the totals. First Team is the '
    + 'top of the ballot, Second Team the next; the rest are in range but outside.</div>'
    + '<div class="scroll"><table><thead><tr><th>Player</th><th>Position</th><th>Rank</th><th>Projected</th></tr></thead><tbody>'
    + rows.map(function(r){
        return '<tr><td class="nm">'+esc(r.player)+'</td><td class="pos">'+esc(r.pos)+'</td>'
          + '<td>'+(r.rank ? '#'+esc(r.rank)+(r.pool ? ' <span class="sub">of '+esc(r.pool)+'</span>' : '') : '-')
          + (r.thin ? ' <span class="sub" title="Too few schools in this pool for a conference ranking yet">thin pool</span>' : '')+'</td>'
          + '<td>'+chip(r)+'</td></tr>';
      }).join('')
    + '</tbody></table></div></div>';
  return h;
}

/* every conference top five the school holds, from the leader boards - or,
   given a player id, every one that player holds */
function dashTopFive(lb, pid){
  var team = tnameOf(STATE.teamId);
  var h = '<div class="card"><h2>Conference top five</h2>';
  var mine = (lb || []).filter(function(x){ return (pid ? x.playerId === pid : x.teamId === STATE.teamId) && x.rank !== null && x.rank <= 5; })
    .sort(function(a, b){ return a.rank - b.rank || String(a.label).localeCompare(String(b.label)); });
  if (!mine.length) return h + '<div class="sub">'+(pid ? 'You are not in a top five yet.' : 'Nobody from '+esc(team)+' is in a top five yet.')+'</div></div>';
  h += '<div class="sub" style="margin-bottom:10px">Where '+(pid ? 'you stand' : esc(team)+' players stand')+' in the top five of any stat category, conference-wide.</div>'
    + '<div class="scroll"><table><thead><tr><th>Rank</th><th>Player</th><th>Category</th><th class="num">Value</th></tr></thead><tbody>'
    + mine.map(function(x){
        return '<tr'+(x.prov ? ' class="provrow" title="includes stats awaiting approval"' : '')+'>'
          + '<td><span class="tk '+(x.rank === 1 ? 'ok' : 'none')+'">#'+esc(x.rank)+'</span></td>'
          + '<td class="nm">'+esc(x.player)+'</td><td>'+esc(x.label || x.cat)+'</td><td class="num">'+esc(x.value)+'</td></tr>';
      }).join('')
    + '</tbody></table></div></div>';
  return h;
}

function dashTiles(pi){
  var a = STATE.auth || {}, tt = STATE.acctTotals;
  var n = function(v){ return Number(v || 0); };
  var wait = function(k, head){
    var c = n(a[k]);
    return dashTile(c ? 'hot' : 'calm', head, c, c ? 'Open Approvals' : 'Nothing waiting', 'approvals');
  };
  var h = '<div class="dash-tiles">'
    + wait('pendingAccounts', 'Account requests')
    + wait('pendingCorrections', 'Stat corrections')
    + wait('pendingStats', 'Stats to approve')
    + (a.isAdmin && tt ? dashTile('', 'Accounts', n(tt.players) + n(tt.coaches),
                                  n(tt.players)+' players · '+n(tt.coaches)+' coaches', 'approvals') : '');
  return h + dashPlaysTile(pi) + '</div>';
}

/* the Top 10 Plays window, open or shut, on every dashboard */
function dashPlaysTile(pi){
  var n = function(v){ return Number(v || 0); };
  if (pi && pi.open)
    return dashTile('go', 'Top 10 Plays', esc(pi.label)+' open',
                    n(pi.count)+' clip'+(n(pi.count)===1?'':'s')+' in · closes '+esc(pi.closesText || ''));
  if (pi)
    return dashTile('shut', 'Top 10 Plays', pi.lastLabel ? esc(pi.lastLabel)+' closed' : 'Closed',
                    (pi.lastLabel ? n(pi.lastCount)+' clip'+(n(pi.lastCount)===1?'':'s')+' in' : '')
                    + (pi.nextLabel && pi.opensText ? (pi.lastLabel ? ' · ' : '')+esc(pi.nextLabel)+' opens '+esc(pi.opensText) : ''));
  return '';
}

/* one chip per box, always a number: the named players with stats on that
   side, or the total on file. Red when nothing is in or too few players are,
   amber when some of it is waiting in Approvals, green otherwise. */
function dashBox(b, meta){
  if (!b || b.empty) return '<span class="tk bad">None</span>';
  var n = Number(b.n || 0);
  var text = meta.unit === 'players' ? n+' player'+(n===1?'':'s') : n+' '+esc(meta.unit);
  var cls = b.short ? 'bad' : b.pending ? 'warn' : 'ok';
  return '<span class="tk '+cls+'"'
    + (b.pending ? ' title="Some of this is waiting in Approvals"' : b.short ? ' title="Fewer than '+STATE.minPlayers+' players"' : '')
    + '>'+text+'</span>';
}
/* the reason a row is short of complete, in words */
function dashShort(r, boxes){
  return (r.short || []).map(function(k){
    var b = boxes.filter(function(x){ return x.key === k; })[0] || {};
    var n = Number(r.boxes[k] && r.boxes[k].n || 0);
    return 'Only '+n+' player'+(n===1?'':'s')+' on '+String(b.label || k).replace(/^individual /, '');
  }).join(' · ');
}
function dashRank(r){ return !r.game ? 3 : !r.complete ? 0 : r.pending ? 1 : 2; }

/* the verdict on one team's week */
function dashStatus(r, boxes){
  return r.complete
    ? '<span class="tk ok">All stats submitted</span>'
      + (r.pending ? ' <span class="tk warn">Awaiting approval</span>' : '')
    : r.missing.length === boxes.length
      ? '<span class="tk bad">Nothing submitted</span>'
      : r.missing.length
        ? '<span class="tk bad">Missing: '+esc(r.missing.join(', '))+'</span>'
        : '<span class="tk bad">'+esc(dashShort(r, boxes))+'</span>';
}
function dashResult(g){
  if (!g.played || g.us === null || g.them === null) return '<span class="sub">no score yet</span>';
  return (g.us > g.them ? 'W ' : g.us < g.them ? 'L ' : 'T ')+g.us+'-'+g.them;
}

function dashTracker(tr, title){
  var one = tr && tr.team;
  var h = '<div class="card"><h2>'+esc(title || 'Stat submissions')+' · '+(one ? esc(tr.team.name)+' · ' : '')+esc(snameOf(STATE.seasonId))+'</h2>';
  if (!tr || tr.error){
    return h + '<div class="sub err">'+esc(tr && tr.error || 'Unavailable.')+'</div></div>';
  }
  STATE.minPlayers = Number(tr.minPlayers || 0);
  var admin = !!tr.isAdmin;
  var cov = tr.coverage || { received:0, played:0, pct:0, minGames:3 };
  h += '<div class="sub" style="margin-bottom:12px">'+(one ? 'Each week you played.' : 'Each school, each week it played.')
    + ' Team boxes carry the totals on file - yards on offense, tackles on defense. Individual boxes count the '
    + 'named players with stats on that side; a side counts as submitted at '+STATE.minPlayers+' players or more. '
    + 'Amber is in and waiting in Approvals.</div>';
  /* Stats In is a different question from the boxes beside it. The boxes say
     what arrived; this says somebody looked and it was ALL of it - which is
     what the other side's Allowed figures are built on, and cannot be worked
     out from the numbers, because one carry for five yards is a complete-
     looking fragment. */
  h += '<div class="sub" style="margin-bottom:12px"><b>Stats in</b> is the last column, and it '
    + 'is the one the <b>Allowed</b> boards read. A defence\u2019s allowed figures come off the '
    + 'other side\u2019s box score, so a game counts for the opponent only once this school\u2019s '
    + 'line is confirmed complete here. Until it is ticked it contributes nothing, which is the '
    + 'safe way round. A team needs '+esc(String(cov.minGames))+' confirmed games before it is '
    + 'ranked. <b>'+cov.received+' of '+cov.played+'</b> received this season ('+cov.pct+'%).</div>';
  if (!tr.weeks.length)
    return h + '<div class="sub">No games have been played yet.</div></div>';
  if (admin && !one)
    h += '<div class="row" style="gap:8px;margin-bottom:10px"><button type="button" class="mini" '
      + 'data-a="scovBaseline">Mark the whole season received\u2026</button></div>';
  var boxes = tr.boxes || [];
  if (one){
    /* one school: a plain table, newest week first, no folds to open */
    h += '<div class="scroll"><table><thead><tr><th>Week</th><th>Opponent</th><th>Result</th>'
      + boxes.map(function(b){ return '<th>'+esc(b.label)+'</th>'; }).join('')
      + '<th>Status</th><th style="width:150px">Stats in</th></tr></thead><tbody>'
      + tr.weeks.map(function(w){
          return w.rows.filter(function(r){ return r.game; }).map(function(r){
            return '<tr'+(r.complete ? '' : ' class="needs"')+' data-week="'+esc(w.key)+'"><td class="nm">'+esc(w.label)+'</td>'
              + '<td>'+(r.game.home ? 'vs ' : 'at ')+esc(r.game.opponent)+'</td><td>'+dashResult(r.game)+'</td>'
              + boxes.map(function(b){ return '<td>'+dashBox(r.boxes[b.key], b)+'</td>'; }).join('')
              + '<td class="st">'+dashStatus(r, boxes)+'</td>'+scovCell(r, admin)+'</tr>';
          }).join('');
        }).join('')
      + '</tbody></table></div>';
    return h + '</div>';
  }
  h += tr.weeks.map(function(w){
    var rows = w.rows.slice().sort(function(x, y){ return dashRank(x) - dashRank(y) || x.team.localeCompare(y.team); });
    var got = w.rows.filter(function(r){ return r.covApplies && scovOn(r); }).length;
    var covN = Number(w.covPlayed || 0);
    var sum = '<summary>'+esc(w.label)
      + '<span class="sub">'+w.complete+' of '+w.teams+' complete</span>'
      + (w.pending ? '<span class="tk warn">'+w.pending+' awaiting approval</span>' : '')
      + (w.missing ? '<span class="tk bad">'+w.missing+' missing</span>'
                   : (w.teams ? '<span class="tk ok">All stats submitted</span>' : ''))
      /* A week with no conference game in it has nothing to receive, and a
         "0 of 0" pill beside the others is noise pretending to be a warning. */
      + (covN ? '<span data-scovtally="'+esc(w.key)+'" class="tk '
                + (got === covN ? 'ok' : got ? 'warn' : 'bad')+'">'
                + got+' of '+covN+' received</span>' : '')
      + '</summary>';
    var tools = (admin && covN)
      ? '<div class="row" style="gap:8px;margin:8px 0">'
        + '<button type="button" class="mini" data-a="scovAll" data-on="1" data-w="'+esc(w.key)+'">'
        + 'Tick the whole week</button>'
        + '<button type="button" class="mini" data-a="scovAll" data-on="0" data-w="'+esc(w.key)+'">'
        + 'Untick the week</button></div>' : '';
    var tbl = '<div class="scroll"><table><thead><tr><th>Team</th><th>Opponent</th>'
      + boxes.map(function(b){ return '<th>'+esc(b.label)+'</th>'; }).join('')
      + '<th>Status</th><th style="width:150px">Stats in</th></tr></thead><tbody>'
      + rows.map(function(r){
          if (!r.game)
            return '<tr class="provrow"><td class="nm">'+esc(r.team)+'</td><td>-</td>'
              + boxes.map(function(){ return '<td>-</td>'; }).join('')
              + '<td class="st"><span class="tk none">No game</span></td><td>-</td></tr>';
          var opp = (r.game.home ? 'vs ' : 'at ')+esc(r.game.opponent)
            + (r.game.played ? '' : ' <span class="sub">(no score yet)</span>');
          return '<tr'+(r.complete ? '' : ' class="needs"')+'><td class="nm">'+esc(r.team)+'</td><td>'+opp+'</td>'
            + boxes.map(function(b){ return '<td>'+dashBox(r.boxes[b.key], b)+'</td>'; }).join('')
            + '<td class="st">'+dashStatus(r, boxes)+'</td>'+scovCell(r, admin)+'</tr>';
        }).join('')
      + '</tbody></table></div>';
    return '<details class="wk" data-week="'+esc(w.key)+'">'+sum+tools+tbl+'</details>';
  }).join('');
  return h + '</div>';
}


/* -
   SHELL - tabs, pickers, routing
   - */

var VIEWS = {
  dashboard: { label:'Dashboard',  show:viewDashboard },
  profile:   { label:'My Profile', show:viewProfile   },
  coachprof: { label:'My Coach Page', show:viewCoachProfile },
  mystats:   { label:'My Stats',   show:viewMyStats   },
  roster:    { label:'Roster',     show:viewRoster    },
  scores:    { label:'Scores',     show:viewScores    },
  stats:     { label:'Stat Entry', show:viewStats     },
  links:     { label:'Team Links', show:viewLinks     },
  approvals: { label:'Approvals',  show:viewApprovals },
  coverage:  { label:'Coverage',   show:viewCoverage  }
};

function tabList(){
  var a = STATE.auth, out = [];
  if (!a) return out;
  // A coach or an administrator who is also on a roster edits his own profile
  // through the same two tabs a player does.
  if (a.playerId) out.push('profile','mystats');
  // a coach edits the public page that carries his name; admins without a
  // coaching row have no such page, and the view says so if opened anyway
  if (a.isCoach) out.push('coachprof');
  if (a.isCoach || a.isAdmin) out.push('roster','scores','stats','links','approvals');
  if (a.isAdmin) out.push('coverage');
  // everyone with a role lands on a dashboard; everything else is a tab it opens
  if (a.isCoach || a.isAdmin || a.isFan || a.playerId) out.unshift('dashboard');
  return out;
}

function renderTabs(){
  var tabs = tabList();
  var el = document.getElementById('tabs');
  if (!tabs.length){ el.style.display = 'none'; el.innerHTML = ''; return; }
  el.style.display = '';
  el.className = 'tabs';
  el.setAttribute('role','tablist');
  el.innerHTML = tabs.map(function(k){
    var badge = (k === 'approvals' && STATE.auth.pendingCount)
      ? '<span class="badge">'+STATE.auth.pendingCount+'</span>' : '';
    return '<button type="button" role="tab" aria-selected="'+(STATE.view===k?'true':'false')+'" data-a="tab" data-v="'+k+'" class="'+(STATE.view===k?'on':'')+'">'
      + esc(VIEWS[k].label)+badge+'</button>';
  }).join('');
}

ACT.tab = function(el){ navigate(el.getAttribute('data-v')); };

function navigate(name){
  if (location.hash === '#/' + name) go(name);
  else location.hash = '#/' + name;
}
window.addEventListener('hashchange', function(){ route(); });

function route(){
  var tabs = tabList();
  if (!tabs.length) return;
  var want = String(location.hash || '').replace(/^#\/?/, '');
  go(tabs.indexOf(want) >= 0 ? want : tabs[0]);
}

/* The portal counts itself the same way the site does, and just as coarsely:
   which section, never whose. The browser id is the same anonymous one, and
   nothing about the signed-in account travels with it. */
var PHIT = { last: '', id: '', ref: (function(){ try { return document.referrer || ''; } catch(e){ return ''; } })() };
function phit(view){
  if (view === PHIT.last) return;
  PHIT.last = view;
  if (!PHIT.id){
    try { PHIT.id = localStorage.getItem('ucbac_ask_id') || ''; } catch(e){}
    if (!PHIT.id) PHIT.id = 'p' + Math.random().toString(36).slice(2);
  }
  try { call('svcHit', ['portal', view, PHIT.id, PHIT.ref, window.innerWidth || 0, false]).catch(function(){}); }
  catch(e){}
}

function go(name){
  if (STATE.auth && STATE.auth.accountUpdateRequired){UcbacPolicies.requireUpdate(STATE.auth);return;}
  if (!VIEWS[name]) return;
  ++PORTAL_VERSION;
  smartSelectClose(false);
  var nextView=name!==STATE.view;
  phit(name);
  STATE.view = name;
  STATE.corr = null;
  renderTabs();
  renderCtx();
  barHide();
  alertBox('', '');
  noticeBox('', '');
  try { VIEWS[name].show(); }
  catch (e){
    alertBox('bad', esc(msgOf(e)));
    paint('<div class="card sub">That page could not be drawn.</div>');
  }
  var view=document.getElementById('view');
  if(nextView)window.scrollTo(0,0);
  try{view.focus({preventScroll:true});}catch(e){view.focus();}
}

/* The site's header, worn by the portal: every link is a SAME-TAB trip back
   to the public site. Built from the server-reported address - location.href
   in this sandbox is a googleusercontent frame, and links built from it go
   nowhere. */
function renderSitebar(){
  var el = document.getElementById('sitebar');
  if (!el || window.EMBED) return;
  var base = String((STATE.boot && STATE.boot.portalUrl) || '').split('?')[0];
  if (!base || base.indexOf('googleusercontent') >= 0){ el.style.display = 'none'; return; }
  function L(hash, label){
    return '<a href="'+base+(hash?'#/'+hash:'')+'" target="_top">'+label+'</a>';
  }
  el.innerHTML = '<div class="in">'
    + '<a class="sb-brand" href="'+base+'" target="_top">UCBAC<span>Stats</span></a>'
    + '<nav aria-label="Public site navigation">'+L('','Home')+L('scores','Scores')+L('teams','Teams')+L('stats','Stats')
    + L('allconference','All-Conference')
    + '</nav>'
    + '<span class="sb-here">Profile</span></div>';
  el.style.display = 'block';
}

/* the person, and what they are: "Kaleb Myers · Coach". The school is on
   every page that concerns it; the masthead is the site bar's. */
var ROLE_WORD = { ADMIN: 'Administrator', COACH: 'Coach', PLAYER: 'Player', FAN: 'Fan' };
function renderWho(){
  var a = STATE.auth;
  var bits = [];
  if (a.role && a.role !== 'PUBLIC') bits.push(ROLE_WORD[a.role] || a.role);
  if (a.status && a.status !== 'ACTIVE' && a.status !== 'NONE') bits.push(a.status);
  var h1 = document.querySelector('.wrap>header h1');
  if (h1) h1.style.display = a.signedIn ? 'none' : '';
  document.getElementById('who').innerHTML = a.signedIn
    ? '<span class="me">'+esc(a.name || a.email)+(bits.length ? ' · '+esc(bits.join(' · ')) : '')+'</span>'
      + ' <a href="#" data-a="signOut" class="sub" style="color:inherit">sign out</a>'
    : 'not signed in';
}

/* The tools that work on one team in one season - the only places the team
   and season pickers appear. The dashboard, Approvals and Coverage stand on
   their own. */
var CTX_VIEWS = { roster:1, scores:1, stats:1, links:1 };

function renderCtx(){
  var a = STATE.auth, el = document.getElementById('ctx');
  if (!a || !(a.isCoach || a.isAdmin) || !STATE.boot){ el.innerHTML = ''; el.removeAttribute('data-sig'); return; }
  if (!CTX_VIEWS[STATE.view]){ el.innerHTML = ''; el.removeAttribute('data-sig'); return; }
  /* redrawn on every navigation, but only rebuilt when something it shows
     has changed - the pickers keep their enhanced state otherwise */
  var sig = (a.isAdmin ? 'A' : 'C') + '|' + STATE.teamId + '|' + STATE.seasonId + '|' + STATE.boot.teams.length + '|' + STATE.boot.seasons.length;
  if (el.getAttribute('data-sig') === sig && el.firstChild) return;
  el.setAttribute('data-sig', sig);

  var h = '';
  if (a.isAdmin){
    h += '<label class="sr-only" for="portal-team">Team</label><select id="portal-team" aria-label="Team" data-h="pickTeam" style="width:auto">'
      + STATE.boot.teams.map(function(t){
          return '<option value="'+esc(t.id)+'"'+(t.id===STATE.teamId?' selected':'')+'>'
               + esc(t.name)+'</option>'; }).join('')
      + '</select>';
  }
  h += '<label class="sr-only" for="portal-season">Season</label><select id="portal-season" aria-label="Season" data-h="pickSeason" style="width:auto">'
    + STATE.boot.seasons.map(function(x){
        return '<option value="'+esc(x.id)+'"'+(x.id===STATE.seasonId?' selected':'')+'>'
             + esc(x.label)+'</option>'; }).join('')
    + '</select>';
  el.innerHTML = h;
}

/* Everything below is keyed to one team and one season. Changing either throws
   the lot away rather than showing one school's roster beside another's games. */
function dropTeamData(){
  STATE.roster = null; STATE.ta = null; STATE.box = null;
  STATE.boxLoading = null; STATE.capt = null; STATE.pending = null;
  STATE.linkPatch = null; STATE.history = null;
  // a selection is row positions in a roster that no longer exists
  STATE.sel = {}; STATE.armRemove = false; STATE.add = null;
  ['roster','scores','stats','links','approvals'].forEach(function(v){
    DIRTY[v] = {};
  });
}
INP.pickTeam = function(el){
  if (el.value === STATE.teamId) return;
  STATE.teamId = el.value;
  dropTeamData();
  renderCtx();
  go(STATE.view);
};
INP.pickSeason = function(el){
  if (el.value === STATE.seasonId) return;
  STATE.seasonId = el.value;
  dropTeamData();
  renderCtx();
  go(STATE.view);
};

function refreshAuthThen(after){
  call('svcAuthState').then(function(a){
    STATE.auth = a;
    renderWho();
    renderTabs();
    if (after) after();
  }).catch(function(){ if (after) after(); });
}

ACT.retryBoot = function(){ boot(true); };

/* - boot - */

var AUTH_BOOT_VERSION=0;
function boot(again){
  var version=++AUTH_BOOT_VERSION,token=TOKEN;
  if (!again) paintLoading('Signing in',3);
  Promise.all([
    call('svcAuthState'),
    STATE.boot ? Promise.resolve(STATE.boot) : call('svcBootstrap'),
    // Fetched once here rather than per view: the registration form, the roster
    // editor and a player's own profile all render the same chips.
    STATE.options.length ? Promise.resolve(STATE.options)
                         : call('svcPositionOptions').catch(function(){ return []; })
  ]).then(function(r){
    if(version!==AUTH_BOOT_VERSION||token!==TOKEN)return;
    STATE.auth = r[0];
    STATE.boot = r[1];
    if (r[2] && r[2].length) STATE.options = r[2];

    if (!STATE.seasonId) STATE.seasonId = STATE.boot.currentSeason;
    /* A coach is BOUND to his own school. A default picked before sign-in
       resolved (the first team on the list) must never survive into a coach's
       session - that is how Elkton's coach was shown Aberdeen's roster. */
    var bound = STATE.auth.teamId || '';
    if (STATE.auth.role === 'COACH' && bound && STATE.teamId !== bound){
      STATE.teamId = bound;
      dropTeamData();
    }
    if (!STATE.teamId)
      STATE.teamId = bound || ((STATE.boot.teams[0] || {}).id || '');
    renderWho();
    renderCtx();
    renderSitebar();

    var a = STATE.auth;
    if (UcbacPolicies.requireUpdate(a)){
      document.getElementById('tabs').innerHTML='';
      paint('<div class="card"><h2>Account update</h2><p>Complete the account update to continue, or sign out to browse public stats.</p></div>');
      finishPortalLaunch(STATE.boot.brand&&STATE.boot.brand.logo);
      return;
    }
    if(returnHomeAfterLogin())return;
    if (a.status === 'ACTIVE' && tabList().length){
      route();
      showLoginNote();
      finishPortalLaunch(STATE.boot.brand&&STATE.boot.brand.logo);
      return;
    }

    renderTabs();
    if (!a.signedIn) (PORTAL_VIEW === 'signup' ? viewSignup : viewLogin)();
    else if (a.status === 'NONE' || a.status === 'REJECTED') viewSignup();
    else if (a.status === 'PENDING' || a.status === 'SUSPENDED') viewPending();
    else viewNoRole();
    showLoginNote();
    finishPortalLaunch(STATE.boot.brand&&STATE.boot.brand.logo);
  }).catch(function(e){
    if(version!==AUTH_BOOT_VERSION||token!==TOKEN)return;
    document.getElementById('who').textContent = 'not signed in';
    alertBox('bad', esc(msgOf(e)));
    paint('<div class="card"><h2>The portal could not start</h2><p class="sub">Check your connection, then reload this page.</p><button type="button" class="primary" data-a="retryBoot">Try again</button></div>');
    finishPortalLaunch('');
  });
}

/* The one-sentence outcome of a registration that rode in with the sign-in -
   shown AFTER the routed view paints, because every view starts by clearing
   the alert box. */
function showLoginNote(){
  if (!STATE.loginNote) return;
  alertBox(/could not/i.test(STATE.loginNote) ? 'bad' : 'ok', esc(STATE.loginNote));
  STATE.loginNote = null;
}

UcbacPolicies.init({baseUrl:function(){return POLICY_EXEC_URL;},call:call,token:function(){return TOKEN;},signOut:function(){ACT.signOut();},accepted:function(a){STATE.auth=a;if(!returnHomeAfterLogin())boot(true);}});
window.addEventListener('storage',function(ev){
  if(ev.key!=='ucbac_token'||TOKEN===(ev.newValue||''))return;
  if(HOME_MOUNTED){TOKEN=ev.newValue||'';return;}
  UcbacPolicies.reset(); TOKEN=ev.newValue||''; ++PORTAL_VERSION;
  STATE.auth=null; STATE.prof=null; dropTeamData(); boot(true);
});
boot(false);

document.addEventListener('keydown',function(ev){
  var tab=ev.target.closest&&ev.target.closest('[role="tab"]');
  if(!tab||!['ArrowLeft','ArrowRight','Home','End'].includes(ev.key))return;
  var list=tab.closest('[role="tablist"]');if(!list)return;
  var tabs=Array.from(list.querySelectorAll('[role="tab"]')).filter(function(t){return !t.disabled;});
  var i=tabs.indexOf(tab);if(i<0)return;
  ev.preventDefault();
  i=ev.key==='Home'?0:ev.key==='End'?tabs.length-1:(i+(ev.key==='ArrowRight'?1:-1)+tabs.length)%tabs.length;
  tabs[i].focus({preventScroll:true});
});
