/* - box scores received -
   Which schools' lines are confirmed all in. It lives on the stat-submission
   tracker rather than on a page of its own, because it IS that grid: the same
   school, the same week, the same game, asked one question further. A separate
   checklist meant reading the same fifteen rows twice to answer "did it come
   in" and then "was all of it there".

   It gates something: a defence's Allowed figures are read off the OTHER
   side's box score, so an unconfirmed line is not a good line, it is a
   missing one. */

function scovPatch(){ return STATE.scovPatch || (STATE.scovPatch = {}); }
function scovKey(g, tid){ return g + '|' + tid; }

/* What the box says right now: the saved value, unless it has been clicked. */
function scovOn(r){
  var k = scovKey(r.game.id, r.teamId);
  var p = scovPatch();
  return (k in p) ? p[k] : !!r.statsIn;
}

INP.scov = function(el){
  var k = el.getAttribute('data-k');
  scovPatch()[k] = el.checked;
  markDirty('scov:' + k);
  scovCount();
};

/* Repaint the week's tally in place rather than redrawing the whole tracker:
   a rebuild closes every open week and throws away the reader's place in a
   fifteen-row table they are working down. */
function scovCount(){
  var tr = STATE.tracker;
  if (!tr || !tr.weeks) return;
  tr.weeks.forEach(function(w){
    var cov = w.rows.filter(function(r){ return r.covApplies; });
    var got = cov.filter(scovOn).length;
    var el = document.querySelector('[data-scovtally="'+w.key+'"]');
    if (el && cov.length){
      el.textContent = got + ' of ' + cov.length + ' received';
      el.className = 'tk ' + (got === cov.length ? 'ok' : got ? 'warn' : 'bad');
    }
  });
}

ACT.scovAll = function(el){
  var tr = STATE.tracker; if (!tr) return;
  var wk = el.getAttribute('data-w'), on = el.getAttribute('data-on') === '1';
  (tr.weeks.filter(function(w){ return w.key === wk; })[0] || { rows: [] }).rows
    .forEach(function(r){
      if (!r.covApplies) return;
      var k = scovKey(r.game.id, r.teamId);
      scovPatch()[k] = on;
      markDirty('scov:' + k);
      var box = document.querySelector('input[data-h="scov"][data-k="'+k+'"]');
      if (box) box.checked = on;
    });
  scovCount();
};

};

function scovDone(message){

function saveScov(){
  var p = scovPatch(), keys = Object.keys(p);
  if (!keys.length) return;
  var marks = keys.map(function(k){

/* The cell itself. A coach sees the state and no box: the tick is an

/* - quick actions -
   My Profile is one long page: identity, then a season's measurables, then a
   commitment, offers, links, accolades and every earlier season. On a phone
   that is a lot of thumb between the top and the thing somebody opened it to
   change. So each card registers itself as it is built and a row of jumps is
   printed above them all, in the order they appear.

   Registered on the way past rather than listed up front, because which cards
   exist depends on the player: a freshman has no earlier seasons and nobody
   with no accolades gets an Accolades jump to an empty card. */
var PF_SECS = [];
function pfSec(id, label){ PF_SECS.push([id, label]); return ''; }
function pfJumps(){
  if (PF_SECS.length < 3) return '';   // two cards do not need a table of contents
  return '<nav class="pfjump" aria-label="Jump to a section">'
    + PF_SECS.map(function(s){
        return '<a href="#pf-'+esc(s[0])+'" data-a="pfJump" data-sec="'+esc(s[0])+'">'
             + esc(s[1])+'</a>'; }).join('')
    + '</nav>';
}
/* Scrolled rather than jumped: an anchor would drop the reader at the card with
   no sense of having moved, and on a phone the portal's own header would cover
   the heading it landed on. */
ACT.pfJump = function(el){
  var box = document.getElementById('pf-'+el.getAttribute('data-sec'));
  if (!box) return;
  var top = box.getBoundingClientRect().top + window.pageYOffset - 12;
  try { window.scrollTo({ top: top, behavior: 'smooth' }); }
  catch(e){ window.scrollTo(0, top); }
};

function pfVal(key, fallback){
  return (STATE.patch && STATE.patch[key] !== undefined) ? STATE.patch[key] : fallback;
}

function renderProfile(){
  var d = STATE.prof, ed = d.editable;
  PF_SECS = [];
  var cur = d.seasons.filter(function(x){ return x.seasonId === ed.seasonId; })[0] || null;
  if (!STATE.pos) STATE.pos = cur ? cur.positions.slice() : [];

  var h = schemaWarning(ed.missingColumns);

  if (STATE.profFor)
    h += '<div class="row" style="margin-bottom:10px">'
      + '<button type="button" class="mini" data-a="profBack">&lsaquo; Back to roster</button>'
      + '<span class="sub grow">Editing <b>'+esc(d.player.name)+'</b>&rsquo;s profile - the same '
      + 'fields the player sees, with your name on the change log.</span></div>';

  // his own page carries the share card; a coach editing him does not
  if (!STATE.profFor) h += shareCardHtml();

  /* The two things the header menu used to offer, now on the page the menu
     stood in front of. His public page is what everyone else sees, so it opens
     in its own tab rather than taking the form away from him mid-edit; sign out
     sits at the far end, where it cannot be hit reaching for anything else.
     A coach editing somebody else gets neither: it is not his page to view and
     signing out of a roster edit is nobody's intention. */
  if (!STATE.profFor){
    var pubId = d.player.playerId || STATE.auth.playerId || '';
    h += '<div class="row" style="margin:0 0 10px;align-items:center">'
      + (pubId && SITE_URL
          ? '<a class="pflink" target="_blank" rel="noopener" href="'
            + esc(SITE_URL.replace(/#.*$/,'')) + '#/player/' + esc(pubId) + '">My public page &#8599;</a>'
          : '')
      + '<span class="grow"></span>'
      + '<a href="#" data-a="signOut" class="sub" style="color:inherit">Sign out</a></div>';
  }

  h += '<!--PFJUMPS-->'+pfSec('you','You')+'<div class="card" id="pf-you"><h2>'+(STATE.profFor?esc(d.player.name):'You')+'</h2><div class="form">';
  if (has(ed.fields,'displayName')){
    /* One stored name, two boxes. The split keeps a generational suffix with
       the surname - "Tremayne / Pickett Jr" - and the boxes recompose into
       displayName on input, so everything downstream (the save, the rename
       guard, the audit row) still sees the one field it always has. */
    var pfName = pfNameParts(pfVal('displayName', d.player.name));
    h += '<div><label class="f">First name</label>'
      + '<input type="text" data-h="pfName" data-part="first" autocomplete="given-name" value="'
      + esc(pfName.first)+'"></div>'
      + '<div><label class="f">Last name</label>'
      + '<input type="text" data-h="pfName" data-part="last" autocomplete="family-name" value="'
      + esc(pfName.last)+'">'
      + '<div class="hint">A change that drops the surname on file (<b>'+esc(ed.surname)
      + '</b>) is refused, and every rename is recorded for your coach to see. A profile carries your '
      + 'statistics, and renaming it moves them.</div></div>';
  }
  if (has(ed.fields,'gradYear')){
    var gy = String(pfVal('gradYear', d.player.gradYear) || '');
    var y0 = new Date().getFullYear(), gys = [''];
    for (var yy = y0; yy <= y0 + 6; yy++) gys.push(String(yy));
    if (gy && gys.indexOf(gy) < 0) gys.push(gy);
    h += '<div><label class="f">Graduation year</label>'
      + '<select data-h="pf" data-k="gradYear">'
      + gys.map(function(o){ return '<option value="'+esc(o)+'"'+(o===gy?' selected':'')+'>'
          + (o?'Class of '+esc(o):'-')+'</option>'; }).join('')
      + '</select></div>';
  }
  if (has(ed.fields,'hometown'))
    h += '<div><label class="f">Hometown</label>'
      + '<input type="text" data-h="pf" data-k="hometown" value="'
      + esc(pfVal('hometown', d.player.hometown))+'"></div>';
  if (has(ed.fields,'profilePhotoId'))
    h += '<div><label class="f">Profile photo (Drive link or file id)</label>'
      + '<input type="text" data-h="pf" data-k="profilePhotoId" value="'
      + esc(pfVal('profilePhotoId', d.player.profilePhotoId))+'"></div>';
  if (has(ed.fields,'bio')){
    var bio = pfVal('bio', d.player.bio);
    h += '<div class="wide"><label class="f">Bio</label>'
      + '<textarea data-h="pfBio">'+esc(bio)+'</textarea>'
      + '<div class="hint" id="bioCount">'+String(bio).length+' of '+ed.bioMaxChars
      + ' characters. This is published on the public site.</div></div>';
  }
  h += '</div>';
  if (d.player.updatedAt)
    h += '<div class="sub" style="margin-top:10px">Last edited '
      + esc(dateLong(d.player.updatedAt))

  h += '</div>';

  h += pfSec('season','Jersey & measurables')+'<div class="card" id="pf-season"><h2>'+esc(snameOf(ed.seasonId))+' &mdash; Jersey, Measurables &amp; Positions</h2>';

      + 'adds you, and then your jersey, measurables and positions can be edited here. '
      + 'Everything above is editable now.</div>';

    if (has(ed.seasonFields,'jersey'))

        + '<input type="text" class="jn" data-h="pf" data-k="jersey" value="'
        + esc(pfVal('jersey', cur.jersey))+'"></div>';
    // The same measurable list the coach's roster editor renders, from the same
    // server constant - height through the lifts, each with its range and step.
    (ed.measurables||[]).forEach(function(m){

        return;

        + '<input type="number" step="'+m.step+'" min="'+m.min+'" max="'+m.max+'" '
        + 'data-h="pfNum" data-k="'+m.key+'" value="'
        + cell(pfVal(m.key, cur[m.key]))+'"></div>';
    });
    if (has(ed.seasonFields,'positions'))
      h += '<div class="wide"><label class="f">Positions</label>'
        + posPicker(STATE.pos, 'profile')
        + '<div class="hint">Every position you actually play, with the sub-position where '
        + 'you know it. Your coach can change these - All-Conference eligibility follows '
        + 'them.</div></div>';
    h += '</div>';
    if (cur.isCaptain)
      h += '<div class="sub" style="margin-top:10px"><span class="pill ok">Captain</span> '
        + 'Named by your coach. Only he can change that.</div>';
    h += '<div class="sub" style="margin-top:10px">Leave a box empty to say a measurement was '
      + 'never taken. An empty box is not a zero and is never stored as one.</div>';
  }
  h += '</div>';

  if (has(ed.fields,'commitment') || has(ed.fields,'commitmentLevel')
      || has(ed.fields,'commitmentDate')){
    h += pfSec('commit','Commitment')+'<div class="card" id="pf-commit"><h2>Commitment</h2><div class="form">';
    if (has(ed.fields,'commitment'))
      h += '<div><label class="f">School</label>'
        + '<input type="text" data-h="pf" data-k="commitment" value="'
        + esc(pfVal('commitment', d.commitment.commitment))+'" placeholder="Towson University"></div>';
    if (has(ed.fields,'commitmentLevel')){
      var lvl = pfVal('commitmentLevel', d.commitment.commitmentLevel);
      h += '<div><label class="f">Level</label><select data-h="pf" data-k="commitmentLevel">'

        + (ed.commitmentLevels||[]).map(function(x){
            return '<option value="'+esc(x)+'"'+(x===lvl?' selected':'')+'>'+esc(x)+'</option>';
          }).join('')
        + '</select></div>';
    }
    h += '</div></div>';
  }

     level. One row shows by default; Add more appends rows; a cleared school

  if (has(ed.fields,'offers')){
    if (!STATE.offers) STATE.offers = (d.offers || []).map(function(o){
      return { school: o.school, level: o.level || '' };

    h += pfSec('offers','Offers')+'<div class="card" id="pf-offers"><h2>Offers</h2>'
      + '<div class="sub" style="margin-bottom:10px">Schools that have offered you. These '
      + 'are shown on your public profile beside your commitment.</div>'

          return '<div class="row" style="margin-bottom:8px">'
            + '<input type="text" class="grow" data-h="offSchool" data-i="'+i+'" value="'
            + esc(o.school)+'" placeholder="School">'
            + '<select data-h="offLevel" data-i="'+i+'" style="width:110px">'

            + (ed.commitmentLevels||[]).map(function(x){

              }).join('')
            + '</select>'
            + '<button type="button" class="mini danger" data-a="offDrop" data-i="'+i+'">×</button>'

  }

  h += pfSec('links','Links')+'<div class="card" id="pf-links"><h2>Links</h2><div class="form">';
  if (has(ed.fields,'hudlUrl'))
    h += '<div class="wide"><label class="f">Hudl</label>'

      + esc(pfVal('maxPrepsUrl', d.links.maxPrepsUrl))+'" placeholder="https://maxpreps.com/--"></div>';
  if (has(ed.fields,'xHandle'))

  if (has(ed.fields,'instagramHandle'))
    h += '<div><label class="f">Instagram handle</label>'
      + '<input type="text" data-h="pf" data-k="instagramHandle" value="'
      + esc(pfVal('instagramHandle', d.links.instagramHandle))+'" placeholder="@yourname"></div>';
  h += '</div><div class="hint" style="margin-top:8px">A link must be https and must point at '

    + 'Anything else is refused - this page is public and it names a minor.</div></div>';

  if (STATE.awards && STATE.awards.length){
    h += pfSec('awards','Accolades')+'<div class="card" id="pf-awards"><h2>Accolades</h2><table><tbody>'
      + STATE.awards.map(function(x){
          return '<tr><td style="width:90px" class="sub">'+esc(x.seasonId)+'</td>'
            + '<td><span class="nm">'+esc(x.award)+'</span>'
            + (x.detail?' <span class="sub">'+esc(x.detail)+'</span>':'')+'</td></tr>';
        }).join('')
      + '</tbody></table>'
      + '<div class="sub" style="margin-top:10px">Recorded by the conference. If one is '
      + 'missing or wrong, tell your coach - an award is not something a profile can claim '
      + 'for itself.</div></div>';
  }

  var past = d.seasons.filter(function(x){ return x.seasonId !== ed.seasonId; });
  if (past.length){
    h += pfSec('past','Earlier seasons')+'<div class="card" id="pf-past"><h2>Earlier seasons</h2><div class="scroll"><table><thead><tr>'
      + '<th>Season</th><th>Team</th><th style="width:50px">#</th>'
      + '<th style="width:70px">Ht</th><th style="width:60px">Wt</th><th>Positions</th>'
      + '</tr></thead><tbody>'
      + past.map(function(x){
          return '<tr><td class="nm">'+esc(x.seasonId)+'</td><td>'+esc(x.teamName)+'</td>'
            + '<td>'+esc(x.jersey)+'</td><td>'+ftIn(x.heightInches)+'</td>'
            + '<td>'+num(x.weightLbs)+'</td>'
            + '<td class="sub">'+esc(x.positions.join(', '))+'</td></tr>';
        }).join('')
      + '</tbody></table></div>'
      + '<div class="sub" style="margin-top:10px">Read-only. A past season is the record of '
      + 'what happened, not a draft.</div></div>';
  }

  paint(h.replace('<!--PFJUMPS-->', pfJumps()));
  /* The card draws itself as soon as the page is up, so the first thing he sees
     under "Share your profile" is the card rather than a paragraph about one. */
  if (!STATE.profFor) sharePreviewDraw();
  alertBox('', '');
  barShow({ label:'Save profile', save:saveProfile, reset:function(){
    STATE.prof = null; STATE.pos = null; STATE.offers = null;
    STATE.patch = {}; clearDirty(); viewProfile(); } });
}

INP.pf = function(el){
  STATE.patch[el.getAttribute('data-k')] = readText(el);
  markDirty(el.getAttribute('data-k'));
};
/* "Tremayne Pickett Jr" -> { first:'Tremayne', last:'Pickett Jr' }: the
   suffix belongs to the surname, and a middle name stays with the first. */
function pfNameParts(v){
  var toks = String(v||'').replace(/\s+/g,' ').trim().split(' ');
  if (toks.length < 2) return { first: toks[0]||'', last: '' };
  var last = toks.pop();
  if (/^(jr\.?|sr\.?|ii|iii|iv|v)$/i.test(last) && toks.length > 1)
    last = toks.pop() + ' ' + last;
  return { first: toks.join(' '), last: last };
}
INP.pfName = function(){
  var f = document.querySelector('[data-h="pfName"][data-part="first"]');
  var l = document.querySelector('[data-h="pfName"][data-part="last"]');
  STATE.patch.displayName =
    ((f&&f.value||'').trim()+' '+(l&&l.value||'').trim()).replace(/\s+/g,' ').trim();
  markDirty('displayName');
};
INP.pfNum = function(el){
  STATE.patch[el.getAttribute('data-k')] = readNum(el);
  markDirty(el.getAttribute('data-k'));
};
/* The two height boxes combine into stored inches; blank feet clears it. */
INP.pfHt = function(el){
  var v = readFtIn(el);
  STATE.patch.heightInches = v === null ? '' : v;
  markDirty('heightInches');
};

/* - Share profile -
   The link to his public page and a 1200×630 card for the post, drawn here
   in his own browser from what the page already shows: name, school, number,
   positions, measurables, the top of his line. The server (Share.gs) puts
   both on the share host when one is set up, so a pasted link previews as
   the card; otherwise the link is the site's own and the card is his to
   attach. */
var SHARE_LOGO_WAIT = 2500;    // how long to wait for the school's logo before drawing without it

/* What the card is showing: the whole season, or one game; and which side of
   the ball. Both are the player's choice, remembered while he is on the page
   so remaking the card does not throw the choice away. */
var SHARE_SIDES = [['ALL','All'],['OFFENSE','Offense'],['DEFENSE','Defense'],['SPECIAL','Special teams']];
function shareOpts(){
  if (!STATE.shareOpt) STATE.shareOpt = { scope: 'SEASON', side: 'ALL' };
  return STATE.shareOpt;
}

/* His games this season, newest first, for the game picker: only the ones he
   actually has a stat line in — a card of a game he did not play is a card
   with nothing on it. */
function shareGames(mine, seasonId){
  var seen = {}, out = [];
  ((mine && mine.gameLog) || []).forEach(function(r){
    if (r.season !== seasonId || !r.gameId || seen[r.gameId]) return;
    seen[r.gameId] = 1;
    out.push({ id: r.gameId, week: r.week,
               label: (r.week === null || r.week === undefined ? 'Game' : 'Week '+r.week)
                      + (r.opp ? ' vs '+r.opp : ''),
               // the two sides and the result, so the card can draw the
               // scoreboard rather than name the opponent and stop there
               home: r.home || '', away: r.away || '',
               homeName: r.homeName || '', awayName: r.awayName || '',
               hs: r.hs, as: r.as });
  });
  return out.sort(function(a, b){ return (b.week || 0) - (a.week || 0); });
}

/* The crests, in a form a canvas will actually export.
   The pages show a school's mark with a plain <img>, which Drive serves
   without complaint. A canvas is stricter — it refuses a picture from
   another origin that has not said it may be used — so the card asked Drive
   for the crest, was refused, and drew nothing. The server fetches the same
   file and hands back the bytes, which settles the question. Held for the
   visit; '-' marks a school whose crest has already been asked for and is
   not coming, so it is not asked for again. */
function shareLoadCrests(ids){
  STATE.crest = STATE.crest || {};
  var want = ids.filter(function(id, i){ return id && !STATE.crest[id] && ids.indexOf(id) === i; });
  if (!want.length) return Promise.resolve();
  return Promise.all(want.map(function(id){
    return call('svcTeamCrest', [id])
      .then(function(u){ STATE.crest[id] = u || '-'; }, function(){ STATE.crest[id] = '-'; });
  }));
}
function shareCrest(id){
  var u = (STATE.crest || {})[id];
  return (u && u !== '-') ? u : '';
}
/* the schools whose crests this card needs: his own, and the opponent's when
   the card speaks for one game */
function shareCrestIds(){
  if (!STATE.prof) return [];
  var d = shareData(STATE.prof, STATE.mine);
  return [shareMyTeamId(), d.matchup ? d.matchup.them.id : ''].filter(Boolean);
}

/* A school as the card wants it: crest, name, record. The record comes from
   the bootstrap, which already carries every team's for every season because
   the Scores page wears it beside the name. A school outside the conference
   has neither crest nor record, and shows as a name. */
function shareTeamCard(id, fallbackName, seasonId){
  var t = ((STATE.boot && STATE.boot.teams) || []).filter(function(x){ return x.id === id; })[0] || {};
  var rec = STATE.boot && STATE.boot.records && STATE.boot.records[seasonId];
  return { id: id, name: String(t.name || fallbackName || id || '').toUpperCase(),
           logo: shareCrest(id) || t.logo || '', color: t.color || '', record: (rec && rec[id]) || '' };
}

/* The game as a scoreboard: his team first, the opponent second, each with its
   crest and its record, and the result in a word. Null when the game has no
   final score, or when he is not plainly one of the two sides — a card cannot
   report a result nobody has recorded. */
function shareMatchup(game, teamId, seasonId){
  if (!game) return null;
  var hs = Number(game.hs), as = Number(game.as);
  if (game.hs === null || game.hs === undefined || game.as === null || game.as === undefined) return null;
  if (isNaN(hs) || isNaN(as)) return null;
  var atHome = game.home && game.home === teamId;
  var away = game.away && game.away === teamId;
  if (!atHome && !away) return null;
  var us = shareTeamCard(teamId, atHome ? game.homeName : game.awayName, seasonId);
  var them = shareTeamCard(atHome ? game.away : game.home,
                           atHome ? game.awayName : game.homeName, seasonId);
  us.score = atHome ? hs : as;
  them.score = atHome ? as : hs;
  return { us: us, them: them, atHome: !!atHome,
           result: us.score > them.score ? 'WIN' : us.score < them.score ? 'LOSS' : 'TIE',
           week: (game.week === null || game.week === undefined) ? '' : 'WEEK ' + game.week };
}

/* the school he is playing for this season, for the card and the picker */
function shareMyTeamId(){
  var prof = STATE.prof; if (!prof) return '';
  var ed = prof.editable || {}, seasons = prof.seasons || [];
  var cur = seasons.filter(function(x){ return x.seasonId === ed.seasonId; })[0] || seasons[0] || {};
  return cur.teamId || '';
}

/* the picker says how each game finished, so he is choosing a night he
   remembers rather than a week number */
function shareGameOption(g, teamId, seasonId){
  var m = shareMatchup(g, teamId, seasonId);
  return m ? g.label + ' (' + m.result.charAt(0) + ' ' + m.us.score + '-' + m.them.score + ')' : g.label;
}

function shareOptsHtml(){
  var o = shareOpts();
  var seasonId = shareSeasonId(), teamId = shareMyTeamId();
  var games = shareGames(STATE.mine, seasonId);
  var h = '<div class="form" style="margin-bottom:12px">'
    + '<div><label class="f" for="shareScope">Stats to show</label>'
    + '<select id="shareScope" data-h="shareScope">'
    + '<option value="SEASON"'+(o.scope === 'SEASON' ? ' selected' : '')+'>Season totals</option>'
    + games.map(function(g){
        return '<option value="'+esc(g.id)+'"'+(o.scope === g.id ? ' selected' : '')+'>'
               + esc(shareGameOption(g, teamId, seasonId))+'</option>';
      }).join('')
    + '</select>'
    + (games.length ? '' : '<div class="hint">No game lines yet this season, so only season totals.</div>')
    + '</div>'
    + '<div><label class="f" for="shareSide">Categories</label>'
    + '<select id="shareSide" data-h="shareSide">'
    + SHARE_SIDES.map(function(x){
        return '<option value="'+x[0]+'"'+(o.side === x[0] ? ' selected' : '')+'>'+esc(x[1])+'</option>';
      }).join('')
    + '</select></div></div>';
  return h;
}

/* What the card will look like, drawn here in his browser from what the page
   already holds — no server call, so it can be redrawn on every change of the
   two selectors. Two sentences describing a picture are worse than the picture:
   showing it is the only way to know whether the statistics he picked are the
   ones he meant. */
function shareOptKey(){ var o = shareOpts(); return o.scope + '|' + o.side; }

function sharePreviewHtml(){
  var pv = STATE.sharePrev;
  if (pv && pv.dataUrl && pv.key === shareOptKey())
    return '<img class="share-img" src="'+pv.dataUrl+'" alt="Preview of your share card" '
         + 'width="1200" height="630">';
  /* A box of the card's own shape while it draws, so the panel does not jump
     when the picture arrives. */
  return '<div class="share-img share-skel" role="img" aria-label="Drawing your card"></div>';
}

/* Draw, then repaint — but only if the choice has not moved on while we were
   drawing. Two quick changes of the selector would otherwise race, and the
   slower draw would land last and show the wrong card. */
function sharePreviewDraw(){
  if (!STATE.prof || !STATE.auth || !STATE.auth.playerId) return;
  var want = shareOptKey();
  var mine = STATE.mine ? Promise.resolve(STATE.mine)
           : call('svcPlayer', [STATE.auth.playerId])
               .then(function(p){ STATE.mine = p; return p; }).catch(function(){ return null; });
  // the address is printed ON the card, and only the server knows it
  var where = STATE.shareWhere ? Promise.resolve(STATE.shareWhere)
            : call('svcShareWhere', ['']).then(function(w){ STATE.shareWhere = w; return w; })
                .catch(function(){ return null; });
  Promise.all([mine, where])
    .then(function(){ return shareLoadCrests(shareCrestIds()); })
    .then(function(){ return shareDraw(shareData(STATE.prof, STATE.mine)); })
    .then(function(png){
      if (shareOptKey() !== want) return;         // he has changed his mind since
      STATE.sharePrev = { key: want, dataUrl: png ? png.dataUrl : '' };
      shareRepaint();
    })
    .catch(function(){ /* a preview that will not draw is not worth an alert */ });
}

/* the season the card speaks for: the one his profile is editing */

/* Changing either selector redraws the card from what is already loaded — no

/* Every stat the card can show, in the order a box score reads them: the
   field as the database names it, the tile's label, which side of the ball it
   belongs to, and a weight that decides which few make the card when there
   are more than six. Weight is "how much does this number impress" — 300
   passing yards and 3 sacks both deserve a tile, so a sack counts for thirty
   yards. */
var SHARE_STATS = [
  { f:'PassComp', label:'COMP',      side:'OFFENSE', w:3,  pair:'PassAtt' },
  { f:'PassYds',  label:'PASS YDS',  side:'OFFENSE', w:1 },
  { f:'PassTD',   label:'PASS TD',   side:'OFFENSE', w:25 },
  { f:'RushAtt',  label:'CARRIES',   side:'OFFENSE', w:2 },
  { f:'RushYds',  label:'RUSH YDS',  side:'OFFENSE', w:1 },
  { f:'RushTD',   label:'RUSH TD',   side:'OFFENSE', w:25 },
  { f:'Rec',      label:'REC',       side:'OFFENSE', w:8 },
  { f:'RecYds',   label:'REC YDS',   side:'OFFENSE', w:1 },
  { f:'RecTD',    label:'REC TD',    side:'OFFENSE', w:25 },
  { f:'Pancakes', label:'PANCAKES',  side:'OFFENSE', w:8 },
  { f:'TACKLES',  label:'TACKLES',   side:'DEFENSE', w:5, sum:['TackleSolo','TackleAssist'] },
  { f:'TFL',      label:'TFL',       side:'DEFENSE', w:12 },
  { f:'Sacks',    label:'SACKS',     side:'DEFENSE', w:30, dp:1 },
  { f:'Int',      label:'INT',       side:'DEFENSE', w:45 },
  { f:'PassDef',  label:'PBU',       side:'DEFENSE', w:12 },
  { f:'FF',       label:'FF',        side:'DEFENSE', w:35 },
  { f:'FR',       label:'FR',        side:'DEFENSE', w:35 },
  { f:'DefTD',    label:'DEF TD',    side:'DEFENSE', w:60 },
  { f:'FGM',      label:'FG',        side:'SPECIAL', w:30, pair:'FGA' },
  { f:'XPM',      label:'XP',        side:'SPECIAL', w:10, pair:'XPA' },
  /* Kicking and returning pile up yardage that is not the same kind of
     achievement as a yard from scrimmage: 268 punting yards is a night's
     work, two rushing touchdowns is a game. Weighted so it reads that way. */
  { f:'Punts',    label:'PUNTS',     side:'SPECIAL', w:2 },
  { f:'PuntYds',  label:'PUNT YDS',  side:'SPECIAL', w:0.15 },
  { f:'KR',       label:'KR',        side:'SPECIAL', w:6 },
  { f:'KRYds',    label:'KR YDS',    side:'SPECIAL', w:0.4 },
  { f:'PR',       label:'PR',        side:'SPECIAL', w:6 },
  { f:'PRYds',    label:'PR YDS',    side:'SPECIAL', w:0.4 },
  /* A blocked kick is one play and it is usually the play of the night,
     so it outranks the yardage around it the way a sack does. */
  { f:'Blocks',   label:'BLOCKS',    side:'SPECIAL', w:35 }
];
var SHARE_MAX_TILES = 6;

/* One bag of totals for whatever the player asked to show: every game row of
   the chosen game added together, or the season line. Stat rows arrive one
   per category, so a game is several rows and they must be summed. */
function shareSums(mine, seasonId, scope){
  const out = {};
  const add = function(bag){
    Object.keys(bag || {}).forEach(function(k){ out[k] = (out[k] || 0) + Number(bag[k] || 0); });
  };
  if (scope === 'SEASON'){
    const ss = ((mine && mine.seasonStats) || []).filter(function(x){ return x.seasonId === seasonId; })[0];
    add(ss && ss.stats);
    // an older server sends only the named fields; fall back to those
    if (ss && !ss.stats){
      const legacy = { PassAtt:ss.passAtt, PassComp:ss.passComp, PassYds:ss.passYds, PassTD:ss.passTD,
                       RushAtt:ss.rushAtt, RushYds:ss.rushYds, RushTD:ss.rushTD,
                       Rec:ss.rec, RecYds:ss.recYds, RecTD:ss.recTD,
                       TackleSolo:ss.solo, TackleAssist:ss.asst, TFL:ss.tfl, Sacks:ss.sacks, Int:ss.int };
      Object.keys(legacy).forEach(function(k){ if (legacy[k]) out[k] = Number(legacy[k]); });
    }
    return out;
  }
  ((mine && mine.gameLog) || []).forEach(function(r){
    if (r.gameId !== scope) return;
    add(r.stats || { PassYds:r.passYds, PassTD:r.passTD, RushAtt:r.rushAtt, RushYds:r.rushYds,
                     RushTD:r.rushTD, Rec:r.rec, RecYds:r.recYds, RecTD:r.recTD,
                     TackleSolo:r.solo, TackleAssist:r.asst, Sacks:r.sacks, Int:r.int });
  });
  return out;
}

/* The tiles, from the totals: only what he did, only the side he asked for,
   the biggest six, in box-score order. */
function shareTiles(sums, side){
  const val = function(st){
    if (st.sum) return st.sum.reduce(function(a, k){ return a + Number(sums[k] || 0); }, 0);
    return Number(sums[st.f] || 0);
  };
  return SHARE_STATS
    .map(function(st, i){ return { st: st, v: val(st), i: i }; })
    .filter(function(x){ return x.v > 0 && (side === 'ALL' || x.st.side === side); })
    .map(function(x){
      var text = x.st.dp ? String(Number(x.v.toFixed(x.st.dp))) : String(x.v);
      // a made-of-attempted stat reads as the pair a box score prints
      if (x.st.pair && Number(sums[x.st.pair] || 0) > 0) text = text + '/' + Number(sums[x.st.pair]);
      return { v: text, label: x.st.label, w: x.v * x.st.w, i: x.i };
    })
    .sort(function(a, b){ return b.w - a.w; }).slice(0, SHARE_MAX_TILES)
    .sort(function(a, b){ return a.i - b.i; });
}

/* what goes on the card, from the profile and the public player read */
function shareData(prof, mine){
  var o = shareOpts();
  var ed = prof.editable || {}, seasons = prof.seasons || [];
  var cur = seasons.filter(function(x){ return x.seasonId === ed.seasonId; })[0] || seasons[0] || {};
  var seasonId = cur.seasonId || shareSeasonId();
  var team = ((STATE.boot && STATE.boot.teams) || []).filter(function(t){ return t.id === cur.teamId; })[0] || {};

  // a game that is no longer in his log (a season change, a deleted line)
  // falls back to the season rather than drawing an empty card
  var games = shareGames(mine, seasonId);
  var scope = o.scope;
  if (scope !== 'SEASON' && !games.filter(function(g){ return g.id === scope; }).length) scope = 'SEASON';
  var game = games.filter(function(g){ return g.id === scope; })[0] || null;

  var stats = shareTiles(shareSums(mine, seasonId, scope), o.side);

  var filled = function(v){ return v !== null && v !== undefined && v !== ''; };
  var facts = [];
  if (filled(cur.heightInches)) facts.push(Math.floor(Number(cur.heightInches)/12)+'′'+(Number(cur.heightInches)%12)+'″');
  if (filled(cur.weightLbs)) facts.push(cur.weightLbs+' lbs');
  if (filled(cur.forty)) facts.push(Number(cur.forty).toFixed(2)+'s 40');
  if (filled(cur.vertical)) facts.push(Number(cur.vertical)+'″ vert');
  if (filled(cur.bench)) facts.push(cur.bench+' bench');
  if (filled(cur.squat)) facts.push(cur.squat+' squat');
  facts = facts.slice(0, 4);

  var badge = STATE.boot && STATE.boot.acbadge && STATE.boot.acbadge[seasonId];
  badge = badge && badge[prof.player.playerId];
  var ac = '';
  if (badge){
    var b = String(badge).split('|')[0];
    ac = 'PROJECTED '+(b.charAt(b.length-1) === '1' ? 'FIRST' : 'SECOND')+' TEAM · '+b.slice(0, -1);
  }
  var sideWord = { OFFENSE:'OFFENSE', DEFENSE:'DEFENSE', SPECIAL:'SPECIAL TEAMS' }[o.side] || '';
  /* A game card leads with the scoreboard — both crests, the score, both
     records — and a season card leads with the season, so the record rides
     beside the school's name where the reader is already looking. */
  var matchup = game ? shareMatchup(game, cur.teamId, seasonId) : null;
  var records = (STATE.boot && STATE.boot.records && STATE.boot.records[seasonId]) || {};
  var record = records[cur.teamId] || '';
  var score = matchup ? matchup.result.charAt(0) + ' ' + matchup.us.score + '-' + matchup.them.score : '';
  return { name: prof.player.name, grad: prof.player.gradYear || '', jersey: cur.jersey || '',
           pos: (cur.positions || []).join(' / '), team: team.name || tnameOf(cur.teamId || ''),
           mascot: team.mascot || '', color: team.color || '',
           logo: shareCrest(cur.teamId) || team.logo || '',
           season: snameOf(seasonId),
           matchup: matchup, record: scope === 'SEASON' ? record : '', side: sideWord,
           // what the numbers are: the season, or the one game he chose. The
           // card draws the scoreboard instead when there is one; these are
           // the words, and they go in the caption either way.
           scopeLabel: (game ? String(game.label).toUpperCase() : snameOf(seasonId).toUpperCase())
                       + (score ? ' · ' + score : '')
                       + (sideWord ? ' · ' + sideWord : ''),
           facts: facts, stats: stats, ac: ac,
           link: shareCardLink(),
           empty: stats.length ? '' : (o.side === 'ALL'
             ? 'No statistics on file for this yet'
             : 'No ' + (sideWord.toLowerCase()) + ' statistics for this yet') };
}

/* The address printed on the card itself, from what the server said BEFORE
   the card was drawn — the picture carries the address, so the address has to
   be known first. A hosted share page is short enough to read and type; the
   deployment's own address is not, so that falls back to the site's name, and
   the full link still travels in the caption and the share sheet, which is
   where a reader taps rather than retypes. */
function shareCardLink(){
  var w = STATE.shareWhere || STATE.share;
  var link = String((w && w.hosted && w.link) || '');
  if (link && link.length <= 46) return link.replace(/^https?:\/\//, '').replace(/\/$/, '');
  return 'ucbacstats.com';
}

/* The words to paste with the card: who, what, and the link back. */
function sharePostText(){
  var sh = STATE.share;
  var d = (STATE.prof ? shareData(STATE.prof, STATE.mine) : null);
  if (!d) return String((sh && sh.link) || '');
  var bits = [d.name];
  if (d.team) bits.push(d.team + (d.mascot ? ' ' + d.mascot : '') + (d.record ? ' (' + d.record + ')' : ''));
  if (d.grad) bits.push('Class of ' + d.grad);
  var head = bits.join(' · ');
  var line = (d.stats || []).map(function(t){ return t.v + ' ' + t.label.toLowerCase(); }).join(' · ');
  return head + '\n' + d.scopeLabel.toLowerCase().replace(/^\w/, function(c){ return c.toUpperCase(); })
         + (line ? ': ' + line : '') + '\n' + String((sh && sh.link) || '');
}

/* The crests the card wants, fetched together under one deadline.
   A cross-origin picture taints the canvas, so each is asked for anonymously
   and anything that fails — a school with no crest on file, a host that
   refuses — simply comes back null: a card without a crest is still a card,
   a card that never draws is nothing. */
function shareImages(urls){
  return new Promise(function(res){
    var out = urls.map(function(){ return null; }), waiting = 0, done = false;
    var finish = function(){ if (!done){ done = true; res(out); } };
    var timer = setTimeout(finish, SHARE_LOGO_WAIT);
    var settle = function(){ if (--waiting <= 0){ clearTimeout(timer); finish(); } };
    urls.forEach(function(u, i){
      // a data: URL is this page's own and taints nothing; an https one is
      // only worth trying anonymously, and usually will not come
      if (!u || !/^(https|data):/i.test(u)) return;
      waiting++;
      var img = new Image();
      if (!/^data:/i.test(u)) img.crossOrigin = 'anonymous';
      img.onload = function(){ out[i] = img; settle(); };
      img.onerror = settle;
      img.src = u;
    });
    if (!waiting){ clearTimeout(timer); finish(); }
  });
}

/* the card, 1200×630: the school's colour on the left with the number and
   position, the name and the line on the right. Resolves null where a
   canvas cannot be drawn, and the share goes ahead without a picture. */
function shareDraw(d){
  return new Promise(function(res){
    var W = 1200, H = 630, c, g;
    try { c = document.createElement('canvas'); c.width = W; c.height = H; g = c.getContext('2d'); } catch (e){ g = null; }
    if (!g){ res(null); return; }
    var color = /^#[0-9a-f]{6}$/i.test(d.color) ? d.color : '#1418D8';
    var done = false;
    function finish(){
      if (done) return; done = true;
      try { var url = c.toDataURL('image/png'); res({ dataUrl: url, b64: url.split(',')[1] || '' }); }
      catch (e){ res(null); }
    }
    function roundRect(x, y, w, h, r){
      g.beginPath(); g.moveTo(x+r, y); g.arcTo(x+w, y, x+w, y+h, r); g.arcTo(x+w, y+h, x, y+h, r);
      g.arcTo(x, y+h, x, y, r); g.arcTo(x, y, x+w, y, r); g.closePath();
    }
    var F = function(px, w){ return (w || 700)+' '+px+'px system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif'; };
    /* The scoreboard, drawn where a season card prints the season: his school
       on the left, the opponent on the right, each crest in a disc with its
       record beneath the name, the score between them, and above it all the
       week, the side of the field and how it finished. */
    function matchupPanel(m, usImg, themImg){
      var x0 = 470, x1 = W - 40, cx = (x0 + x1) / 2, py = 12, ph = 84, cy = py + 52;
      g.fillStyle = 'rgba(255,255,255,.07)'; roundRect(x0, py, x1 - x0, ph, 18); g.fill();
      // the line above the score, ending in the result: green for a win, red
      // for a loss, and the same grey as the rest for a tie
      var lead = [m.week, m.atHome ? 'HOME' : 'AWAY', d.side].filter(Boolean).join(' · ');
      g.textAlign = 'left'; g.font = F(15, 800);
      var a = lead ? lead + ' · ' : '', wa = g.measureText(a).width, wb = g.measureText(m.result).width;
      var lx = cx - (wa + wb) / 2;
      g.fillStyle = 'rgba(255,255,255,.62)'; g.fillText(a, lx, py + 24);
      g.fillStyle = { WIN:'#3DDC84', LOSS:'#FF6B6B' }[m.result] || 'rgba(255,255,255,.75)';
      g.fillText(m.result, lx + wa, py + 24);
      // a crest in a light disc, or the school's colour wearing its initial
      var disc = function(t, img, dx){
        g.save();
        g.beginPath(); g.arc(dx, cy, 21, 0, Math.PI*2); g.closePath();
        g.fillStyle = img ? 'rgba(255,255,255,.94)'
          : (/^#[0-9a-f]{6}$/i.test(t.color) ? t.color : 'rgba(255,255,255,.16)');
        g.fill();
        if (img){ g.clip(); try { g.drawImage(img, dx - 19, cy - 19, 38, 38); } catch (e){} }
        g.restore();
        if (!img){
          g.textAlign = 'center'; g.fillStyle = '#fff'; g.font = F(20, 900);
          g.fillText(String(t.name || '?').charAt(0), dx, cy + 7);
        }
      };
      disc(m.us, usImg, 512); disc(m.them, themImg, 1118);
      // the name, shrunk to its slot, with the record under it
      var side = function(t, tx, align){
        g.textAlign = align;
        // 170 leaves the score clear air either side of it, whatever the
        // school is called
        var fs = 21;
        do { g.font = F(fs, 800); fs -= 1; } while (g.measureText(t.name).width > 170 && fs > 11);
        g.fillStyle = '#fff'; g.fillText(t.name, tx, cy - 2);
        if (t.record){
          g.font = F(16, 700); g.fillStyle = 'rgba(255,255,255,.6)';
          g.fillText(t.record, tx, cy + 20);
        }
      };
      side(m.us, 545, 'left'); side(m.them, 1085, 'right');
      g.textAlign = 'center'; g.fillStyle = '#fff'; g.font = F(34, 900);
      g.fillText(m.us.score + ' – ' + m.them.score, cx, cy + 12);
      g.textAlign = 'left';
    }
    function paint(logo, oppLogo){
      g.fillStyle = '#0B0D1A'; g.fillRect(0, 0, W, H);
      // the school's colour, a slanted block on the left
      g.fillStyle = color; g.beginPath(); g.moveTo(0, 0); g.lineTo(430, 0); g.lineTo(330, H); g.lineTo(0, H); g.closePath(); g.fill();
      var shade = g.createLinearGradient(0, 0, 0, H); shade.addColorStop(0, 'rgba(255,255,255,.10)'); shade.addColorStop(1, 'rgba(0,0,0,.30)');
      g.fillStyle = shade; g.beginPath(); g.moveTo(0, 0); g.lineTo(430, 0); g.lineTo(330, H); g.lineTo(0, H); g.closePath(); g.fill();
      // the Blitz mark's four colours along the foot
      var bar = g.createLinearGradient(0, 0, W, 0);
      bar.addColorStop(0, '#1E5BFF'); bar.addColorStop(.38, '#8A5CFF'); bar.addColorStop(.72, '#FF3D8A'); bar.addColorStop(1, '#FFB300');
      g.fillStyle = bar; g.fillRect(0, H-10, W, 10);
      g.textBaseline = 'alphabetic';
      // wordmark, and the season
      g.textAlign = 'left'; g.fillStyle = '#fff'; g.font = F(26, 800); g.fillText('UCBAC', 40, 58);
      var wUC = g.measureText('UCBAC').width;
      g.fillStyle = 'rgba(255,255,255,.72)'; g.fillText('STATS', 40 + wUC, 58);
      // the top right says exactly what the numbers below are: the season, or
      // — for one game — the scoreboard itself, which says it better
      if (d.matchup){ matchupPanel(d.matchup, logo, oppLogo); }
      else {
        g.textAlign = 'right'; g.font = F(22, 700);
        g.fillText(String(d.scopeLabel || d.season || '').toUpperCase(), W-40, 58);
      }
      // the number and the position on the colour
      g.textAlign = 'center';
      if (logo){
        try {
          g.save(); g.beginPath(); g.arc(200, 190, 78, 0, Math.PI*2); g.closePath();
          g.fillStyle = 'rgba(255,255,255,.94)'; g.fill(); g.clip(); g.drawImage(logo, 130, 120, 140, 140); g.restore();
        } catch (e){ try { g.restore(); } catch (e2){} }
      }
      var numY = logo ? 440 : 370;
      g.fillStyle = '#fff';
      if (d.jersey){ g.font = F(150, 900); g.fillText('#'+d.jersey, 195, numY); }
      if (d.pos){ g.font = F(38, 800); g.fillStyle = 'rgba(255,255,255,.92)'; g.fillText(d.pos, 195, numY + 62); }
      // the name, shrunk until it fits — a shade smaller under a scoreboard,
      // which reaches lower than a line of text does
      var x = 470, maxW = W - x - 40, size = d.matchup ? 70 : 78;
      g.textAlign = 'left'; g.fillStyle = '#fff';
      do { g.font = F(size, 900); size -= 4; } while (g.measureText(d.name).width > maxW && size > 30);
      g.fillText(d.name, x, d.matchup ? 164 : 160);
      // his school, its record when the card speaks for the season, his class
      var who = [d.team + (d.mascot ? ' ' + d.mascot : ''), d.record || '',
                 d.grad ? 'Class of ' + d.grad : ''].filter(Boolean).join('  ·  ');
      var ws = 30;
      do { g.font = F(ws, 600); ws -= 1; } while (g.measureText(who).width > maxW && ws > 18);
      g.fillStyle = 'rgba(255,255,255,.82)'; g.fillText(who, x, 212);
      if (d.facts.length){ g.fillStyle = 'rgba(255,255,255,.62)'; g.font = F(26, 600); g.fillText(d.facts.join('   ·   '), x, 256); }
      if (d.ac){
        g.font = F(20, 800); var pw = g.measureText(d.ac).width + 36;
        g.fillStyle = '#FFB300'; roundRect(x, 282, pw, 40, 20); g.fill();
        g.fillStyle = '#0B0D1A'; g.fillText(d.ac, x + 18, 309);
      }
      /* His line: up to six tiles, three across. One row of three sits large
         and low the way it always has; a second row shrinks both rows to fit
         between the pill and the address without crowding either. */
      var n = d.stats.length, rows = n > 3 ? 2 : 1;
      var gap = rows === 2 ? 14 : 20;
      var tw = (W - x - 40 - gap * 2) / 3;
      // two rows have to clear the pill above and the address below, which
      // sits at H-40; a tile bottom past 550 collides with it
      var th = rows === 2 ? 100 : 150;
      var ty = rows === 2 ? 336 : 360;
      d.stats.forEach(function(st, i){
        var row = Math.floor(i / 3), col = i % 3;
        // a short last row is centred under the full one rather than left-hung
        var inRow = Math.min(3, n - row * 3);
        var rowW = inRow * tw + (inRow - 1) * gap;
        var tx = x + (rows === 2 && inRow < 3 ? (W - x - 40 - rowW) / 2 : 0) + col * (tw + gap);
        var top = ty + row * (th + gap);
        g.fillStyle = 'rgba(255,255,255,.08)'; roundRect(tx, top, tw, th, 16); g.fill();
        g.textAlign = 'center'; g.fillStyle = '#fff';
        // a paired value like 7/18 is longer, so the figure shrinks to fit
        var fs = rows === 2 ? 44 : 60;
        do { g.font = F(fs, 900); fs -= 4; } while (g.measureText(String(st.v)).width > tw - 24 && fs > 22);
        g.fillText(String(st.v), tx + tw/2, top + (rows === 2 ? 60 : 88));
        g.fillStyle = 'rgba(255,255,255,.7)'; g.font = F(rows === 2 ? 16 : 20, 700);
        g.fillText(st.label, tx + tw/2, top + (rows === 2 ? 84 : 126));
        g.textAlign = 'left';
      });
      if (!n){
        g.fillStyle = 'rgba(255,255,255,.62)'; g.font = F(26, 600);
        g.fillText(d.empty || 'Statistics, standings and All-Conference projections', x, 430);
      }
      // the way back to him: his own page, not the site's front door
      g.fillStyle = 'rgba(255,255,255,.7)'; g.font = F(22, 700); g.textAlign = 'left';
      g.fillText(String(d.link || 'ucbacstats.com'), x, H - 40);
    }
    // his school's crest, and the opponent's when the card is one game's
    shareImages([d.logo, d.matchup ? d.matchup.them.logo : ''])
      .then(function(im){ paint(im[0], im[1]); finish(); })
      .catch(function(){ paint(null, null); finish(); });
  });
}

/* The keys apiPlayer() reports each measure under, season side and game side. A
   measure missing from a projection is shown as unknown rather than as zero:
   "this page does not carry it" and "he did none" are different sentences. */
var SEASON_KEY = {
  PassAtt:'passAtt', PassComp:'passComp', PassYds:'passYds', PassTD:'passTD',
  PassInt:'passInt', RushAtt:'rushAtt', RushYds:'rushYds', RushTD:'rushTD',
  Rec:'rec', RecYds:'recYds', RecTD:'recTD', TackleSolo:'solo',
  TackleAssist:'asst', TFL:'tfl', Sacks:'sacks', Int:'int'
};
var GAME_KEY = {
  PassYds:'passYds', PassTD:'passTD', RushAtt:'rushAtt', RushYds:'rushYds',
  RushTD:'rushTD', Rec:'rec', RecYds:'recYds', RecTD:'recTD',
  TackleSolo:'solo', TackleAssist:'asst', Sacks:'sacks', Int:'int'
};
var SEASON_COLS = ['PassAtt','PassComp','PassYds','PassTD','PassInt','RushAtt','RushYds',
                   'RushTD','Rec','RecYds','RecTD','TackleSolo','TackleAssist','TFL',
                   'Sacks','Int'];
var GAME_COLS = ['PassYds','PassTD','RushAtt','RushYds','RushTD','Rec','RecYds','RecTD',
                 'TackleSolo','TackleAssist','Sacks','Int'];

function viewMyStats(){
  var isCurrent=portalViewCurrent();
  paintLoading('Loading your statistics',5);
  barHide();
  Promise.all([
    loadProfile(),
    STATE.mine ? Promise.resolve(STATE.mine) : call('svcPlayer', [STATE.auth.playerId]),
    call('svcMyCorrections')
  ]).then(function(r){if(!isCurrent())return;
    STATE.mine = r[1];
    STATE.corrections = r[2] || [];
    // his team's schedule feeds the stat-entry game picker; a miss just hides it
    var cur = ((STATE.prof||{}).seasons||[]).filter(function(x){ return x.editable; })[0];
    if (cur && !STATE.myGames){
      return call('svcTeam', [cur.teamId, cur.seasonId]).then(function(t){if(!isCurrent())return;
        STATE.myGames = ((t&&t.games)||[]).map(function(g){
          var oppId = g.home===cur.teamId ? g.away : g.home;
          var opp = (g.home===cur.teamId ? g.awayName : g.homeName) || tnameOf(oppId);
          return { id: g.id, label: (g.week?'Wk '+g.week+' \u2014 ':'')
                   + (g.home===cur.teamId ? 'vs ' : 'at ') + opp };
        }).filter(function(g){ return g.id; });
        renderMyStats();
      }).catch(function(){if(!isCurrent())return; STATE.myGames = []; renderMyStats(); });
    }
    renderMyStats();
  }).catch(function(e){if(!isCurrent())return;
    alertBox('bad', esc(msgOf(e)));
    paint('<div class="card sub">Statistics unavailable.</div>');
  });
}

/* Only the columns somebody actually reported. A column of nothing but blanks
   is a column that invites the reader to think it means zero. */
function usedCols(rows, cols, keys){
  return cols.filter(function(f){
    return rows.some(function(r){
      var v = r[keys[f]];
      return v !== null && v !== undefined && v !== '';
    });
  });
}

      + 'totals only, and some schools still report that way.</div>';
  } else {
    h += '<div class="scroll"><table><thead><tr><th style="width:82px">Season</th>'
      + '<th class="num" style="width:40px">Wk</th><th>Opponent</th>'

  } else {

      + '<th>Where</th><th class="num" style="width:110px">On file</th>'
      + '<th class="num" style="width:110px">You said</th><th style="width:120px">Status</th>'
      + '</tr></thead><tbody>'

            + '<td class="num">'+orBlank(c.oldValue)+'</td>'
            + '<td class="num">'+orBlank(c.newValue)+'</td>'
            + '<td><span class="pill '+cls+'">'+esc(c.status)+'</span>'
            + (c.reviewedBy?'<div class="sub">'+esc(c.reviewedBy)+'</div>':'')+'</td></tr>';
        }).join('')
      + '</tbody></table></div>'
      + '<div class="sub" style="margin-top:10px">A rejected request is not an accusation. If '
      + 'you have film or a game sheet that shows otherwise, take it to your coach.</div>';
  }
  h += '</div>';

  paint(h);
  alertBox('', '');
  renderCorrForm();
}

/* This season if he has a roster row in it; otherwise the newest season he
   has any line in. */
function corrCurrentSeason(){
  var cur = ((STATE.prof||{}).seasons||[]).filter(function(x){ return x.editable; })[0];
  if (cur && cur.seasonId) return cur.seasonId;
  var ids = ((STATE.mine||{}).seasonStats||[]).map(function(r){ return r.seasonId; })
    .concat(((STATE.mine||{}).gameLog||[]).map(function(r){ return r.season; }))
    .filter(Boolean).sort();
  return ids.length ? ids[ids.length-1] : ((STATE.prof||{}).editable||{}).seasonId || '';
}

/* Where a correction can point: the season total, and every game of his
   team's that season - his own schedule, not just the games he has a line
   in, because the game with no line is the one he is here about. */
function corrPlaces(seasonId){
  var out = [{ id:'', label: seasonId + ' · season total' }], seen = {};
  var cur = ((STATE.prof||{}).seasons||[]).filter(function(x){ return x.editable; })[0];
  if (cur && cur.seasonId === seasonId){
    (STATE.myGames||[]).forEach(function(g){
      if (!g.id || seen[g.id]) return;
      seen[g.id] = 1; out.push({ id: g.id, label: seasonId + ' · ' + g.label });
    });
  }
  ((STATE.mine||{}).gameLog||[]).forEach(function(r){
    if (r.season !== seasonId || !r.gameId || seen[r.gameId]) return;
    seen[r.gameId] = 1;
    out.push({ id: r.gameId, label: seasonId + ' · week ' + (r.week===null?'?':r.week) + ' · ' + r.opp });
  });
  return out;
}
