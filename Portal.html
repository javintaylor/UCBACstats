<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>UCBAC Stats Profile</title>
<style>
  :root{
    --bg:#f5f6f8; --card:#fff; --ink:#12181f; --muted:#5d6b7a; --line:#dfe4ea;
    --accent:#1418D8; --accent-ink:#fff; --gold:#C9A227; --ok:#1a7f4b; --warn:#b4690e; --bad:#C0181E;
    --off:#1f5fa8; --def:#a8341f; --st:#5d6b7a; --shimmer:rgba(255,255,255,.72);
  }
  @media (prefers-color-scheme:dark){
    :root{--bg:#0e1116;--card:#161b22;--ink:#e6edf3;--muted:#8b98a5;--line:#272e37;
          --accent:#8A90FF;--accent-ink:#0e1116;--off:#5b9bd5;--def:#e07a5f;--st:#8b98a5;--shimmer:rgba(255,255,255,.12);}
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  .wrap{max-width:1100px;margin:0 auto;padding:20px 16px 96px}
  header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:12px}
  /* Embedded inside the site: its header already says who and where, so the
     portal drops its own masthead and identity - the season (and admin team)
     picker stays, because those belong to the portal's own data. */
  .embed header h1{display:none}
  .embed header .who{display:none}
  .embed header{margin-bottom:6px}
  .embed #sitebar{display:none !important}
  /* the site's bar, worn by the portal - same tab, links lead back home */
  #sitebar{background:#0A0A0E;border-bottom:2px solid #5A61FF;padding:11px 16px}
  #sitebar .in{display:flex;align-items:center;gap:14px;max-width:1100px;margin:0 auto;flex-wrap:wrap}
  #sitebar .sb-brand{font-weight:800;letter-spacing:-.02em;font-size:18px;color:#fff;text-decoration:none;white-space:nowrap}
  #sitebar .sb-brand span{color:#9BA1FF}
  #sitebar nav{display:flex;gap:2px;flex:1;overflow-x:auto}
  #sitebar nav a{padding:6px 10px;border-radius:4px;font-size:14px;color:#AEB4C7;text-decoration:none;white-space:nowrap}
  #sitebar nav a:hover{background:#191926;color:#fff}
  #sitebar .sb-here{background:#5A61FF;color:#fff;font-weight:650;border-radius:4px;padding:6px 10px;font-size:14px;white-space:nowrap}
  h1{font-size:20px;margin:0;letter-spacing:-.01em}
  h2{font-size:15px;margin:0 0 10px;letter-spacing:-.01em}
  .who{margin-left:auto;font-size:13px;color:var(--muted);text-align:right}
  .ctx{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;
        padding:16px;margin-bottom:14px}
  .banner{border:1px solid var(--warn);background:color-mix(in srgb,var(--warn) 7%,var(--card));padding:12px 14px;
          border-radius:8px;margin-bottom:14px;font-size:14px}
  .banner.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 7%,var(--card))}
  .banner.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 7%,var(--card))}
  .banner.info{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 7%,var(--card))}
  table{width:100%;border-collapse:collapse}
  th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;
     color:var(--muted);padding:8px 6px;border-bottom:1px solid var(--line);font-weight:600}
  td{padding:9px 6px;border-bottom:1px solid var(--line);vertical-align:top}
  tr.needs td{background:color-mix(in srgb,var(--warn) 8%,transparent)}
  tr.dirty td{background:color-mix(in srgb,var(--accent) 9%,transparent)}
  .nm{font-weight:600}
  /* All-Conference projection chips, identical to the public site's: explicit
     colors so gold is gold in both themes, both pairs comfortably past AA. */
  .acb{display:inline-block;font:700 9px ui-monospace,SFMono-Regular,Menlo,monospace;
       letter-spacing:.05em;padding:1px 4px;border-radius:3px;vertical-align:1px;
       white-space:nowrap;text-decoration:none}
  .acb.g{background:#D8B23A;color:#241B00;border:1px solid #A88414}
  .acb.s{background:#C9CFDA;color:#161B26;border:1px solid #939CAD}
  .vfy{display:inline-flex;align-items:center;justify-content:center;width:13px;height:13px;
       margin-left:3px;border-radius:50%;background:#1D9BF0;color:#fff;
       font:700 9px -apple-system,BlinkMacSystemFont,sans-serif;line-height:1;
       vertical-align:1px;text-decoration:none}
  .cap{display:inline-flex;align-items:center;justify-content:center;width:14px;height:14px;
       border-radius:3px;background:#3F46E0;color:#fff;
       font:800 9px ui-monospace,SFMono-Regular,Menlo,monospace;vertical-align:1px}
  /* the icon legend on the registration page: real marks, one sentence each */
  .legend .lg-h{font-weight:700;font-size:13px;margin-bottom:8px}
  /* the attestation: a real target to tick, and text that reads as a
     statement the applicant is making rather than terms he is scrolling past */
  .attest{display:flex;gap:10px;align-items:flex-start;margin:6px 0 4px;padding:11px 12px;
    border:1px solid var(--line);border-radius:10px;background:var(--sunk);
    font-size:13px;line-height:1.45;cursor:pointer}
  .attest input{width:18px;height:18px;margin:1px 0 0;flex:none;cursor:pointer}
  /* the disclosure under its heading: quieter, but present - a consent nobody
     can read is not a consent */
  .attest .cns{display:block;margin-top:5px;font-size:12.5px;color:var(--muted);line-height:1.5}
  .legend .lg-r{display:flex;align-items:center;gap:10px;padding:4px 0;font-size:13px}
  .legend .lg-i{flex:0 0 52px;display:inline-flex;justify-content:center}
  .legend .lg-i .vfy,.legend .lg-i .cap{margin-left:0}
  .sub{font-size:12px;color:var(--muted)}
  .pfjump{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
  /* .mini is scoped to button.mini, so the public-page link shares the chips'
     look rather than turning up as a bare blue underline beside them. */
  .pfjump a,a.pflink{display:inline-flex;align-items:center;min-height:34px;padding:0 11px;
    border:1px solid var(--line);border-radius:999px;background:var(--card);
    color:var(--ink);font-size:12.5px;font-weight:600;text-decoration:none;white-space:nowrap}
  .pfjump a:hover,a.pflink:hover{border-color:var(--ink)}
  .fan-actions a{display:inline-flex;align-items:center;min-height:44px;padding:9px 14px;border:1px solid var(--line);border-radius:8px;color:var(--ink);font-weight:600;text-decoration:none}
  .fan-actions a.primary{color:var(--accent-ink);background:var(--accent);border-color:var(--accent)}
  .fan-actions a:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
  .scroll{overflow-x:auto}
  /* The stat tables here are the widest on the site, and a coach entering a
     line reads across from a name. Hold that column still while the rest pans.
     Only a table whose first cell IS the name is held — :has() asks rather than
     assumes, so a table without one keeps its first column moving instead of
     freezing a number nobody navigates by. */
  .scroll table:has(tbody td.nm:first-child) td.nm:first-child,
  .scroll table:has(tbody td.nm:first-child) thead th:first-child
    {position:sticky;left:0;z-index:3;background:var(--card);
     box-shadow:1px 0 0 var(--line)}
  input[type=text],input[type=email],input[type=number],input[type=date],select,textarea{
    width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:6px;
    background:var(--bg);color:var(--ink);font:inherit;font-size:14px}
  textarea{min-height:74px;resize:vertical;line-height:1.45}
  input.unknown{border-style:dashed}
  .jn{width:70px}.sm{width:104px}.stat{width:72px}.yr{width:96px}
  /* the roster never squeezes its boxes: the table is as wide as its cells need, and scrolls */
  .scroll.roster table{min-width:max-content}
  /* a heading sits centred over the box beneath it; the text columns stay left */
  .roster th{text-align:center}
  .roster th.l{text-align:left}
  .roster th .u{text-transform:none;letter-spacing:0}
  /* height: feet and inches side by side, each its own spinner */
  .ftin{display:inline-flex;align-items:center;gap:3px;white-space:nowrap}
  .ftin input{width:58px;text-align:center}
  .ftin span{font-size:14px;color:var(--muted)}
  /* the share card: the picture a post shows, and the link beneath it */
  .share-img{display:block;width:100%;max-width:640px;height:auto;border:1px solid var(--line);border-radius:12px;margin:0 0 12px}
  /* the card's own 1200x630 while it draws, so the panel does not jump */
  .share-skel{aspect-ratio:1200/630;background:var(--bg);
    background-image:linear-gradient(90deg,transparent 0,rgba(127,127,127,.12) 50%,transparent 100%);
    background-size:200% 100%;animation:shareshim 1.1s linear infinite}
  @keyframes shareshim{from{background-position:120% 0}to{background-position:-20% 0}}
  @media(prefers-reduced-motion:reduce){.share-skel{animation:none}}
  .share-link{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .share-link input{flex:1 1 260px;min-width:0;font-size:14px}
  .rules{margin:0 0 12px;padding-left:20px;font-size:13px;color:var(--muted);line-height:1.5}
  .rules li{margin:2px 0}
  .rules b{color:var(--ink)}
  /* the spinner buttons ate a third of every numeric box and clipped the value */
  input[type=number]::-webkit-inner-spin-button,
  input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
  input[type=number]{-moz-appearance:textfield;appearance:textfield}
  /* the position multi-select */
  .pk{position:relative;display:inline-block;min-width:120px;max-width:100%}
  .pk-btn{display:block;width:100%;text-align:left;font-weight:500;font-size:13px;
          padding:5px 8px;border:1px solid var(--line);border-radius:6px;
          background:var(--bg);color:var(--ink);white-space:nowrap;overflow:hidden;
          text-overflow:ellipsis}
  .pk-btn.empty{color:var(--muted)}
  .pk-btn i{float:right;font-style:normal;color:var(--muted);margin-left:6px}
  .pk-btn i.chev{width:7px;height:7px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(45deg);margin-top:3px}
  .pk-panel{width:252px;max-height:320px;overflow-y:auto;background:var(--card);
            border:1px solid var(--line);border-radius:10px;padding:8px;z-index:60;
            box-shadow:0 8px 28px rgba(0,0,0,.18)}
  .pk-grp{font-size:10px;text-transform:uppercase;letter-spacing:.08em;
          color:var(--muted);margin:8px 4px 3px}
  .pk-grp:first-child{margin-top:0}
  .pk-row{display:flex;gap:8px;align-items:center;padding:4px 6px;border-radius:6px;
          cursor:pointer;font-size:14px}
  .pk-row:hover{background:var(--bg)}
  .pk-row input,.pk-sub input{width:auto;margin:0}
  .pk-note{font-style:normal;font-size:11px;color:var(--muted)}
  .pk-subs{display:flex;flex-wrap:wrap;gap:2px 10px;margin:0 6px 4px 26px}
  .pk-sub{display:flex;gap:5px;align-items:center;font-size:13px;color:var(--muted);
          cursor:pointer;padding:2px 0}
  .pk-hint{font-size:11px;color:var(--muted);margin:8px 6px 2px;line-height:1.4}
  tr.provrow td{color:var(--muted)!important}
  button{font:inherit;font-weight:600;border-radius:8px;padding:9px 16px;cursor:pointer;
         border:1px solid var(--line);background:var(--card);color:var(--ink)}
  button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
  button.mini{padding:5px 10px;font-size:13px}
  button.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
  button:disabled{opacity:.5;cursor:default}
  .tabs{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--line);
        margin-bottom:16px}
  .tabs button{border:none;background:none;border-radius:0;color:var(--muted);
               padding:9px 12px;border-bottom:2px solid transparent;white-space:nowrap}
  .tabs button.on{color:var(--ink);border-bottom-color:var(--gold)}
  .badge{display:inline-block;min-width:18px;text-align:center;margin-left:6px;
         background:var(--warn);color:#fff;border-radius:999px;font-size:11px;padding:0 5px}
  .badge.quiet{background:var(--muted)}
  .bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);
       border-top:1px solid var(--line);padding:12px 16px;display:flex;gap:12px;
       align-items:center;justify-content:flex-end}
  .bar .msg{margin-right:auto;font-size:14px}
  .err{color:var(--bad)} .good{color:var(--ok)} .warnc{color:var(--warn)}
  /* the week strip on the coverage checklist: one button a week, carrying how
     much of that week is in, so the gaps are findable without opening each */
  .scovwks{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
  .scovwk{background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:6px 11px;font:600 12px var(--sans);color:var(--ink2);cursor:pointer;min-height:36px}
  .scovwk.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);color:var(--ink)}
  .scovbox{display:inline-flex;align-items:center;gap:8px;cursor:pointer;
    font-weight:600;min-height:44px}
  .scovbox input{width:20px;height:20px;accent-color:var(--ok);cursor:pointer}
  .legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:10px;flex-wrap:wrap}
  .dot{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px}
  /* hidden means hidden, whatever display a rule below gives the element */
  [hidden]{display:none!important}
  .form{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
  .form .wide{grid-column:1/-1}
  label.f{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.06em;
          color:var(--muted);font-weight:600;margin-bottom:4px}
  .hint{font-size:12px;color:var(--muted);margin-top:4px}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .row.end{justify-content:flex-end}
  .seg{display:flex;gap:6px;flex-wrap:wrap}
  .seg button{border-radius:999px;padding:7px 14px}
  .seg button.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .pill{display:inline-block;background:color-mix(in srgb,var(--gold) 18%,transparent);
        color:var(--ink);border-radius:999px;padding:1px 9px;font-size:11px;
        text-transform:uppercase;letter-spacing:.05em;font-weight:600}
  .pill.ok{background:color-mix(in srgb,var(--ok) 20%,transparent)}
  .pill.bad{background:color-mix(in srgb,var(--bad) 20%,transparent)}
  .pill.warn{background:color-mix(in srgb,var(--warn) 22%,transparent)}
  .req{border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px}
  /* The outcome of a decision, printed in the card whose button was pressed.
     The page-top banner is right for a view talking about itself and wrong for
     this: an approvals queue runs down the screen, and somebody deciding the
     fifth request cannot see a sentence three screens above him. That is what
     a refusal looked like - nothing at all. */
  .req-note{margin-top:10px;padding:8px 10px;border-radius:8px;font-size:13px;
            border:1px solid var(--line);background:var(--card)}
  .req-note.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 8%,var(--card))}
  .req-note.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 8%,var(--card))}
  .req.settled{opacity:.7}
  .kv{font-size:13px;color:var(--muted)}
  .kv b{color:var(--ink);font-weight:600}
  .blank{color:var(--muted);font-style:italic}
  .num{text-align:right;font-variant-numeric:tabular-nums}
  .cand{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);
        border-radius:10px;padding:10px;margin-bottom:8px;cursor:pointer}
  .cand[data-on="1"]{border-color:var(--accent);
        background:color-mix(in srgb,var(--accent) 8%,transparent)}
  .cand input{width:auto;margin-top:3px}
  .grow{flex:1;min-width:180px}

  /* Shared public/portal refinement. This keeps the portal task-focused while
     giving it the same broadcast-stat rhythm and accessibility floor. */
  html{color-scheme:light dark;scroll-behavior:smooth}
  body{min-width:320px;font-size:16px;line-height:1.6;overflow-wrap:break-word}
  ::selection{background:var(--accent);color:#fff}
  *{scrollbar-color:var(--line) transparent;scrollbar-width:thin}
  button,input,select,textarea{touch-action:manipulation}
  button,a,input,select,textarea{outline:none}
  button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,
  [tabindex="0"]:focus-visible{box-shadow:0 0 0 3px var(--bg),0 0 0 6px var(--accent);position:relative;z-index:3}
  .sr-only{position:absolute!important;width:1px!important;height:1px!important;padding:0!important;margin:-1px!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;white-space:nowrap!important;border:0!important}
  .skip{position:fixed;left:16px;top:10px;z-index:1000;background:var(--card);color:var(--ink);border:1px solid var(--accent);border-radius:8px;padding:10px 14px;font-weight:750;text-decoration:none;transform:translateY(-160%)}
  .skip:focus{transform:translateY(0)}
  .wrap{max-width:1200px;padding:clamp(22px,4vw,40px) clamp(16px,3vw,28px) 116px}
  #sitebar{position:sticky;top:0;z-index:40;box-shadow:0 10px 32px rgba(5,7,20,.18);padding:10px clamp(16px,3vw,28px)}
  #sitebar .in{max-width:1200px;min-height:48px;flex-wrap:nowrap}
  #sitebar .sb-brand{font-size:20px;min-height:44px;display:inline-flex;align-items:center}
  #sitebar nav{gap:4px;scrollbar-width:none}
  #sitebar nav::-webkit-scrollbar{display:none}
  #sitebar nav a,#sitebar .sb-here{display:inline-flex;align-items:center;min-height:44px;padding:8px 12px;border-radius:8px}
  .wrap>header{min-height:58px;margin-bottom:18px;gap:16px}
  .who a{display:inline-flex;align-items:center;min-height:44px}
  h1{font-size:clamp(30px,4vw,42px);line-height:1;letter-spacing:-.03em}
  h2{font-size:20px;line-height:1.2;margin-bottom:12px}
  .card{border-radius:14px;padding:18px;margin-bottom:16px}
  .banner{border-left-width:1px;border-radius:12px;padding:14px 16px;margin-bottom:16px}
  .banner.bad{border-color:var(--bad)}.banner.ok{border-color:var(--ok)}.banner.info{border-color:var(--accent)}
  input[type=text],input[type=number],input[type=date],input[type=email],select,textarea{min-height:48px;border-radius:8px;padding:9px 10px;font-size:16px}
  textarea{min-height:96px}
  label.f{font-size:11px;margin-bottom:6px}
  button{min-height:44px;border-radius:8px;padding:9px 15px;transition:background-color .16s ease,color .16s ease,border-color .16s ease,transform .12s ease}
  button:active{transform:scale(.98)}
  button.primary{box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
  button.mini{min-height:44px;padding:7px 12px}
  .tabs{gap:8px;margin-bottom:20px}
  .tabs button{min-height:44px;padding:10px 14px;border-radius:8px 8px 0 0}
  .tabs button.on{border-bottom-color:var(--accent)}
  .scroll{overscroll-behavior-inline:contain;border:1px solid var(--line);border-radius:12px}
  table{font-size:14px}
  th{height:42px;padding:9px 8px}
  td{padding:10px 8px}
  a[data-a="rosterProf"]{display:inline-flex;align-items:center;min-height:44px}
  .pk-btn{min-height:48px;border-radius:8px;padding:9px 38px 9px 10px;position:relative}
  .pk-panel{border-radius:12px;box-shadow:0 18px 54px rgba(3,5,18,.26)}
  .pk-row,.pk-sub{min-height:48px}
  .cand,.req{border-radius:12px;padding:14px}
  .bar{z-index:50;min-height:72px;padding:12px max(16px,env(safe-area-inset-right)) calc(12px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));box-shadow:0 -10px 32px rgba(5,7,20,.10)}
  .bar button{min-width:92px}
  .loading-card{display:grid;gap:14px;min-height:190px;align-content:start}
  .skeleton{position:relative;overflow:hidden;background:var(--line);border-radius:8px;min-height:14px}
  .skeleton::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent 0,var(--shimmer) 48%,transparent 100%);transform:translate3d(-115%,0,0);pointer-events:none}
  .sk-heading{width:min(320px,72vw);height:28px}.sk-copy{width:min(520px,88vw);height:16px}.sk-row{height:48px;width:100%}

  /* the dashboards: what is waiting, the season at a glance, who has sent stats */
  .who .me{font-size:15px;color:var(--ink);font-weight:600}
  .dash-tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:16px}
  .tile{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;color:var(--ink);font:inherit;min-height:0}
  button.tile{cursor:pointer}
  .tile .tk-h{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
  .tile .tk-n{font-size:26px;font-weight:750;line-height:1.15;margin:4px 0 2px;letter-spacing:-.02em}
  .tile .tk-s{font-size:12px;color:var(--muted);font-weight:400}
  .tile.hot{border-color:var(--bad)}.tile.hot .tk-n{color:var(--bad)}

/* What goes into a value="" box. Blank stays blank - null, undefined and '' all
   render as an empty box and never as 0, which would read as a reported zero.
   Escaped because a rejected entry is echoed back as the person typed it. */
function cell(v){ return (v===null||v===undefined) ? '' : esc(v); }

/* What a numeric box submits. Blank is null, which every normalizer on the
   server reads as "not reported". Junk goes back as the string the person
   actually typed, so the refusal can name it instead of saying NaN. */
function readNum(el){
  var t = String(el.value == null ? '' : el.value).trim();
  if (t === '') return null;
  var n = Number(t);
  return isNaN(n) ? t : n;
}
function readText(el){ return String(el.value == null ? '' : el.value).trim(); }

/* A number nobody reported is not a zero and must never print as one. */

  return (v===null||v===undefined||v==='') ? '<span class="blank">not reported</span>' : esc(v);
}
function num(v){ return (v===null||v===undefined||v==='') ? '' : esc(v); }
/* 73 -> 6′1″. A height is said in feet everywhere it is read, never in inches. */
function ftIn(v){

/* A game date is a calendar day, not an instant, and must not go through
   new Date(): the browser reads a bare YYYY-MM-DD as UTC midnight and prints
   it in local time, so every Friday fixture west of Greenwich came out as the
   Thursday before it. Read the three fields and build the date from them. */
function dateShort(iso){
  if (!iso) return '';
  /* Anchored: a DATE-ONLY string is a calendar day and is read field by field.
     A full timestamp - "2026-09-11T02:00:00Z", an account created at ten the
     previous evening - is a real instant and still goes through new Date(),
     which converts it to the reader's zone correctly. */
  var m = String(iso).match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if (m) return (+m[2])+'/'+(+m[3])+'/'+m[1];
  try { var d = new Date(iso); if (!isNaN(d.getTime())) return d.toLocaleDateString(); } catch(e){}
  return String(iso).slice(0,10);
}
/* A timestamp IS an instant — an audit row, a sign-in — so this one is right
   to go through new Date(). Only the date-only values above were wrong. */
function dateLong(iso){
  if (!iso) return '';
  try { var d = new Date(iso); if (!isNaN(d.getTime())) return d.toLocaleString(); } catch(e){}
  return String(iso);
}

     text box in the portal earned a "Looks good." on blur - under a stat
     entry, under a coach's roster edit, under the search box - which turns a
     reassurance into noise. A form opts in by carrying data-validate-scope;
     the registration card is the one that does. Everything else keeps its
     own feedback: the server's sentences, which were always the authority. */

/* - position picker -

   and a player's own profile. `own` names whose codes it edits - 'reg',
   'profile', 'add', or a playerSeasonId - and one set of handlers resolves it.

   A row of eighteen chips was the whole width of the roster table; a closed
   dropdown is one cell. The panel offers the seven majors plus TE/ATH and
   special teams; a major with sub-positions (OL, DL, LB, DB) reveals them once
   it is selected. Selecting a sub stores the sub code in the major's place -
   ILB is a Linebacker everywhere positions are matched, so nothing is lost and
   the finer fact is kept. Unselecting the last sub falls back to the bare
   major rather than unselecting the position the person just refined. */

  if (own === 'profile') return STATE.pos || (STATE.pos = []);

          return '<label class="pk-sub"><input type="checkbox" '+(son?'checked':'')
            + ' data-a="posTgl" data-own="'+esc(own)+'" data-code="'+x.code+'"'
            + ' data-major="'+o.code+'">'+esc(x.label)+'</label>';
        }).join('')+'</div>';
      }
    });
  });
  return h + '<div class="pk-hint">Every position he actually plays. Sub-positions are '
    + 'optional - Linebacker alone is a complete answer.</div>';
}

function posRefresh(own){
  var codes = posCodesOf(own) || [];
  var wrap = document.querySelector('.pk[data-pk="'+own+'"]');
  if (!wrap) return;
  var btn = wrap.querySelector('.pk-btn');
  if (btn){
    btn.innerHTML = esc(posSummary(codes)) + '<i class="chev" aria-hidden="true"></i>';
    btn.className = 'pk-btn' + (codes.length ? '' : ' empty');
  }
  var panel = wrap.querySelector('.pk-panel');
  if (panel && panel.style.display !== 'none') panel.innerHTML = posPanelHtml(own);
}

function posCloseAll(){
  document.querySelectorAll('.pk-panel').forEach(function(p){
    window.clearTimeout(p._closeTimer);p.classList.remove('is-open');
    p._closeTimer=window.setTimeout(function(){if(!p.classList.contains('is-open'))p.style.display='none';},90);
  });
  document.querySelectorAll('.pk-btn').forEach(function(b){b.setAttribute('aria-expanded','false');});
}

ACT.posOpen = function(el,ev){
  var own = el.getAttribute('data-own');
  var wrap = document.querySelector('.pk[data-pk="'+own+'"]');
  var panel = wrap && wrap.querySelector('.pk-panel');
  if (!panel) return;
  var open = panel.classList.contains('is-open');
  posCloseAll();
  if (open) return;
  window.clearTimeout(panel._closeTimer);
  el.setAttribute('aria-expanded','true');
  panel.innerHTML = posPanelHtml(own);
  /* Fixed positioning, measured at open. The roster table scrolls inside its
     own box, and an absolutely positioned panel would be clipped by it. */
  var r = el.getBoundingClientRect();
  panel.style.display = 'block';
  panel.style.position = 'fixed';
  panel.style.left = Math.max(8, Math.min(r.left, window.innerWidth - 268)) + 'px';
  var gutter=12,below=window.innerHeight-r.bottom-gutter,above=r.top-gutter;
  var desired=Math.min(panel.scrollHeight||320,320),up=below<desired+8&&above>below;
  var available=Math.max(96,Math.min(320,up?above:below));
  panel.style.maxHeight=available+'px';panel.classList.toggle('opens-up',up);
  panel.style.bottom='';panel.style.top=(up?Math.max(gutter,r.top-Math.min(panel.scrollHeight,available)-8):r.bottom+8)+'px';
  if(ev&&ev.keyboard)panel.style.transition='none';
  window.requestAnimationFrame(function(){panel.classList.add('is-open');
    if(ev&&ev.keyboard){var choices=panel.querySelectorAll('input[type="checkbox"]');if(choices.length)choices[ev.last?choices.length-1:0].focus();}
    if(ev&&ev.keyboard)window.requestAnimationFrame(function(){panel.style.transition='';});
  });
};

document.addEventListener('keydown',function(ev){
  var trigger=ev.target.closest?ev.target.closest('.pk-btn'):null;
  var panel=ev.target.closest?ev.target.closest('.pk-panel'):null;
  if(trigger&&(ev.key==='ArrowDown'||ev.key==='ArrowUp')){
    ev.preventDefault();var own=trigger.getAttribute('data-own'),open=document.querySelector('.pk-panel[data-panel="'+own+'"]');
    if(!open||!open.classList.contains('is-open'))ACT.posOpen(trigger,{keyboard:true,last:ev.key==='ArrowUp'});
    else{var checks=open.querySelectorAll('input[type="checkbox"]');if(checks.length)checks[ev.key==='ArrowUp'?checks.length-1:0].focus();}
    return;
  }
  if(panel&&(ev.key==='ArrowDown'||ev.key==='ArrowUp'||ev.key==='Home'||ev.key==='End')){
    ev.preventDefault();var items=Array.prototype.slice.call(panel.querySelectorAll('input[type="checkbox"]'));
    var at=items.indexOf(document.activeElement),next=ev.key==='Home'?0:ev.key==='End'?items.length-1:Math.max(0,Math.min(items.length-1,at+(ev.key==='ArrowDown'?1:-1)));
    if(items[next])items[next].focus();return;
  }
  if(panel&&ev.key==='Enter'&&ev.target.matches('input[type="checkbox"]')){ev.preventDefault();ev.target.click();return;}
  if(ev.key!=='Escape')return;
  var openPanel=document.querySelector('.pk-panel.is-open');if(!openPanel)return;
  var panelOwner=openPanel.getAttribute('data-panel');posCloseAll();
  var btn=document.querySelector('.pk-btn[data-own="'+panelOwner+'"]');if(btn)btn.focus();
});

ACT.posTgl = function(el){
  var own = el.getAttribute('data-own');
  var codes = posCodesOf(own);
  if (!codes) return;
  var code = el.getAttribute('data-code');
  var major = el.getAttribute('data-major');
  var opt = STATE.options.filter(function(o){ return o.code === code; })[0];

  function drop(c){ var i = codes.indexOf(c); if (i >= 0) codes.splice(i, 1); }

  if (major){
    // a sub-position under its major
    if (el.checked){
      codes.push(code);
      drop(major);                                  // the sub refines the major
    } else {
      drop(code);
      var m = STATE.options.filter(function(o){ return o.code === major; })[0];
      var left = (m && m.subs || []).some(function(x){ return codes.indexOf(x.code) >= 0; });
      if (!left) codes.push(major);                 // refined no further: still the major
    }
  } else if (el.checked){
    codes.push(code);
  } else {
    drop(code);
    (opt && opt.subs || []).forEach(drop);          // the major goes, its subs go
  }
  posRefresh(own);
  posChanged(own);
};

/* Clicking anywhere that is not a picker closes any open panel; so does
   scrolling, because the panel is pinned to the viewport and the trigger it
   belongs to has moved. */
document.addEventListener('click', function(ev){
  var t = ev.target;
  while (t && t !== document.body){
    if (t.className && String(t.className).indexOf('pk') === 0) return;
    t = t.parentNode;
  }
  posCloseAll();
});
document.addEventListener('scroll', function(ev){
  // scrolling INSIDE the panel is just reading the list; every other scroll
  // moves the trigger out from under the pinned panel
  var t = ev.target;
  if (t && t.className && String(t.className).indexOf('pk-panel') >= 0) return;
  posCloseAll();
}, true);

/* - refusals -
   A refused edit stays unsaved. The portal this replaces emptied its pending
   set before it read refused[], so a rejected value disappeared from the queue
   while staying on the screen, and the page then showed numbers the sheet did
   not hold. */
function keepRefused(sentIds, refused){
  var kept = {}, matched = 0;
  (refused||[]).forEach(function(line){
    var hit = sentIds.filter(function(id){ return String(line).indexOf(id + ':') === 0; })[0];
    if (hit){ kept[hit] = true; matched++; }
  });
  // A refusal this page cannot attribute to a row is one it must not discard:
  // hold everything rather than quietly dropping somebody's edit.
  if (matched < (refused||[]).length) sentIds.forEach(function(id){ kept[id] = true; });
  setDirty(kept);
}
function refusalHtml(refused){
  return '<b>Not saved:</b><ul style="margin:6px 0 0;padding-left:18px">'
    + refused.map(function(r){ return '<li>'+esc(r)+'</li>'; }).join('') + '</ul>';
}
function schemaWarning(missing){
  if (!missing || !missing.length) return '';
  return '<div class="banner bad"><b>The workbook is missing '
    + plural(missing.length,'column')+':</b> '+esc(missing.join(', '))
    + '. An administrator must run <b>ensureSchema()</b> before these can be saved. '
    + 'Until then the server refuses them by name rather than writing them nowhere.</div>';
}

/* What the date picker will even offer. A player must be 13 through 19 today,
   so the calendar opens on the years where that is possible; a coach must be
   an adult. The server enforces the same bounds - these just stop the picker
   from starting at the current year and scrolling through a decade. */
/* SAY THE DATE BACK IN WORDS. A native date picker on a phone opens on a
   seeded day - iOS uses the max attribute, and max here is built from today,
   so its DAY is today's day. Someone who spins the year and the month wheels
   and never touches the day wheel submits a date that is right in two parts
   out of three, and looks entirely ordinary.

   It is not theoretical: across 124 accounts, 15 had a birth DAY equal to the
   day they registered, where chance predicts about four (p = 2.5e-05). One of
   them wrote in to say he could not sign in, because the policy screen asks
   for the date again and it no longer matched.

   A wrong digit in a date box is invisible. "28 May 2009" is not, and neither
   is the age beside it, so this prints both under the field as it is typed. */
function dobEcho(v){
  var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(v||'').trim());
  if (!m) return 'Check the day as well as the month and year.';
  var MON = ['January','February','March','April','May','June','July',
             'August','September','October','November','December'];
  var y = +m[1], mo = +m[2], d = +m[3];
  if (mo < 1 || mo > 12) return 'Check the day as well as the month and year.';
  var now = new Date(), age = now.getFullYear() - y;
  if (now.getMonth()+1 < mo || (now.getMonth()+1 === mo && now.getDate() < d)) age--;
  return 'You entered <b>' + d + ' ' + MON[mo-1] + ' ' + y + '</b> \u2014 age ' + age
       + '. Please check the day.';
}

function suDobBounds(role){
  function iso(d){ return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)
                        +'-'+('0'+d.getDate()).slice(-2); }
  var now = new Date();
  if (role === 'FAN'){
    return 'max="'+iso(new Date(now.getFullYear()-13, now.getMonth(), now.getDate()))+'"';
  }
  if (role === 'COACH'){
    var mx = new Date(now.getFullYear()-18, now.getMonth(), now.getDate());
    return 'max="'+iso(mx)+'"';
  }
  // youngest allowed: 13 today. oldest: 19 today (20th birthday not yet passed).
  var max = new Date(now.getFullYear()-13, now.getMonth(), now.getDate());
  var min = new Date(now.getFullYear()-20, now.getMonth(), now.getDate()+1);
  return 'min="'+iso(min)+'" max="'+iso(max)+'"';
}

/* Read the chosen stats file: the server reads it against the selected game
   (grey lines, into the approvals queue) and mails it to the administrators. */
ACT.sfSend = function(el){
  var inp = document.getElementById('sfFile');
  var f = inp && inp.files && inp.files[0];
  var pick = document.querySelector('[data-h="sfGame"]');
  var gameId = (pick && pick.value) || STATE.sfGame || '';
  function say(t){ var m = document.getElementById('sfMsg'); if (m) m.textContent = t; }
  if (!gameId){ say('Pick the game first.'); return; }
  if (!f){ say('Choose a file first.'); return; }
  if (f.size > 7*1024*1024){ say('That file is over the 7 MB limit.'); return; }
  el.disabled = true; say('Sending and reading the file... this can take half a minute.');
  var rd = new FileReader();
  rd.onload = function(){
    var b64 = String(rd.result).split(',')[1] || '';
    call('svcEmailStatsFile', [f.name, f.type, b64, gameId]).then(function(r){
      el.disabled = false; say((r && r.message) || 'Sent.'); if (inp) inp.value = '';
      if (!(r && r.saved)) return;
      // the lines are on that game's box score now, official: redraw what is open
      STATE.ta = null; STATE.history = null; STATE.sfMsg = (r && r.message) || '';
      if (STATE.box && STATE.box.gameId === gameId) loadBox(gameId);
      else withTeamAdmin(function(d){ renderBox(d); });
    }).catch(function(e){ el.disabled = false; say(String(e && e.message || e)); });
  };
  rd.onerror = function(){ el.disabled = false; say('Could not read that file.'); };
  rd.readAsDataURL(f);
};

ACT.suSend = function(el){
  if(!validateScope(document.getElementById('view'))){suSay('Check the highlighted fields and try again.',true);return;}
  var r = suInit();
  if (r.role==='PLAYER' && !r.attest){
    suSay('Tick the box to confirm you play varsity football for this school.', true);
    return;
  }
  if (!r.consent){
    suSay(r.role==='FAN' ? 'Confirm the fan account notice.' : 'Tick the box to confirm you understand what this site publishes.', true);
    return;
  }
  var policies;
  try { policies = UcbacPolicies.payload(document.getElementById('signup-policies')); }
  catch(e) { suSay(e.message, true); return; }
  var payload = { policies:policies, role:r.role, teamId:r.teamId, first:r.first, last:r.last,
                  dob:r.dob, coachLast:r.coachLast, email:r.email,
                  attest:!!r.attest, consent:!!r.consent,
                  coachType:(r.role==='COACH'?(r.coachType||'HEAD'):'') };
  el.disabled = true; r.busy = true;
  suSay('Checking\u2026');

  if (STATE.auth && STATE.auth.signedIn){
    // the session already proves the address; no second code
    call('svcRegisterFinalize', [payload]).then(function(res){
      STATE.su = null;
      STATE.loginNote = (res && res.message) || 'Done.';
      boot(true);
    }).catch(function(e){
      r.busy = false; el.disabled = false;
      suSay(msgOf(e), true);
    });
    return;
  }

  call('svcRegisterStart', [payload]).then(function(res){
    r.busy = false;
    // hand off to the shared code-entry step; redeeming creates the account
    STATE.login = { email: r.email, stage:'code', msg:'', busy:false };
    viewLogin();
    var lm = document.getElementById('suMsg') || document.getElementById('loginMsg');
    // The one thing people actually need told, in a way nobody can miss.
    if (lm) lm.innerHTML = '<b style="color:var(--bad)">Check spam folder</b>';
    else loginSay('Check spam folder', true);
  }).catch(function(e){
    r.busy = false; el.disabled = false;
    suSay(msgOf(e), true);
  });
};

function copyText(t){
  return new Promise(function(res, rej){
    function legacy(){
      try {
        var ta = document.createElement('textarea');
        ta.value = t; ta.setAttribute('readonly', '');
        ta.style.position = 'fixed'; ta.style.opacity = '0';
        document.body.appendChild(ta); ta.select();
        var ok = document.execCommand('copy');
        document.body.removeChild(ta);
        ok ? res() : rej(new Error('copy'));
      } catch (e){ rej(e); }
    }
    if (navigator.clipboard && navigator.clipboard.writeText)
      navigator.clipboard.writeText(t).then(res, legacy);
    else legacy();
  });
}
ACT.invite = function(el){

  copyText(link).then(function(){
    say('Link copied');
    if (out) out.innerHTML = '<div class="sub">Copied. Send it to anyone who should have an account.</div>';
  }, function(){
    // a browser that will not hand over the clipboard: show the link to copy by hand
    say('Copy the link below');

/* The code box meets people halfway. Whatever lands in it - typed, pasted as
   "123 456" or a whole copied email line, or autofilled from Mail via
   autocomplete=one-time-code - is stripped to its six digits, and the moment
   six are present it signs in by itself: nobody should have to find a button
   after their phone just filled the box. */
INP.loginCode  = function(el){
  if(!STATE.login)return; // A final blur/change can arrive after successful sign-in.
  var d = String(el.value||'').replace(/\D/g,'').slice(0,6);
  if (el.value !== d) el.value = d;
  STATE.login.code = d;
  if (d.length === 6) loginAutoGo();
};
function loginAutoGo(){
  var L = STATE.login;

document.addEventListener('paste', function(ev){
  var el = ev.target;
  if (!el || el.getAttribute('data-h') !== 'loginCode') return;
  var t = (ev.clipboardData && ev.clipboardData.getData('text')) || '';
  var d = t.replace(/\D/g,'').slice(0,6);
  if (!d) return;
  ev.preventDefault();
  el.value = d; STATE.login.code = d;
  if (d.length === 6) loginAutoGo();
});
/* Clicking the empty box offers the clipboard: if it holds exactly a six-digit
   code, it is filled and submitted. Blocked in some browsers (the Apps Script
   sandbox does not delegate clipboard-read to Chrome) - then this does nothing
   and pasting still works. Only an exact bare code is accepted; the clipboard
   may hold anything, and anything else is none of this page's business. */
document.addEventListener('focusin', function(ev){
  var el = ev.target;
  if (!el || el.getAttribute('data-h') !== 'loginCode' || el.value) return;
  if (!(navigator.clipboard && navigator.clipboard.readText)) return;
  navigator.clipboard.readText().then(function(t){
    var m = /^\s*(\d{6})\s*$/.exec(String(t||''));
    if (!m || el.value) return;
    el.value = m[1]; STATE.login.code = m[1];
    loginAutoGo();
  }).catch(function(){});
});

function mountSignedInHome(html,token){

    delete window.ucbacAttachHome;

var MEAS_UNIT = { heightInches: 'ft', weightLbs: 'lbs' };

/* Feet and inches, each its own spinner: the arrow keys step them, and
   inches roll into feet at either end. Stored, as ever, as inches. */
function ftInBoxes(handler, ps, inches){
  var set = inches !== '' && inches !== null && inches !== undefined;
  var ft = set ? Math.floor(Number(inches)/12) : '', inch = set ? Number(inches)%12 : '';
  var common = ' data-h="'+handler+'"'+(ps ? ' data-ps="'+ps+'"' : '');
  return '<span class="ftin">'
    + '<input type="number" min="4" max="7" step="1" inputmode="numeric" aria-label="Feet" placeholder="ft"'
    + common+' data-part="ft" value="'+ft+'"><span>&prime;</span>'
    + '<input type="number" min="-1" max="12" step="1" inputmode="numeric" aria-label="Inches" placeholder="in"'
    + common+' data-part="in" value="'+inch+'"><span>&Prime;</span></span>';
}
/* Reads a pair back: total inches, or null when feet is blank. Twelve inches
   becomes the next foot and minus one the last inch of the foot below, and
   the boxes are rewritten to say so. */
function readFtIn(el){
  var wrap = el.closest ? el.closest('.ftin') : el.parentNode;
  var f = wrap.querySelector('[data-part="ft"]'), i = wrap.querySelector('[data-part="in"]');
  var ft = readNum(f), inch = readNum(i);
  if (ft === null || typeof ft !== 'number'){
    if (inch !== null && el === i && typeof inch === 'number'){ f.value = 5; ft = 5; }   // inches typed first: a sensible foot
    else return null;
  }
  if (inch === null || typeof inch !== 'number') inch = 0;
  var total = ft*12 + inch;
  if (total < 0) total = 0;
  ft = Math.floor(total/12); inch = total % 12;
  if (String(f.value) !== String(ft)) f.value = ft;
  if (el === i && (String(i.value) !== String(inch))) i.value = inch;
  else if (el === f && i.value === '') i.value = inch;
  return total;
}

    + '<button type="button" class="mini primary" data-a="rosAdd">Add player</button>'

/* - selection and removal -
   Removal is a two-press button rather than a native confirm: the first press
   arms it and says what it will do, the second does it. Removing takes the
   player off THIS season's roster; his career record and other seasons stay. */

function selBarHtml(){
  var n = Object.keys(STATE.sel).length;
  if (!n) return '';
  var armed = STATE.armRemove;
  return '<b>'+plural(n,'player')+' selected</b>'
    + '<button type="button" class="mini danger" data-a="rosRemove">'
    + (armed ? 'Press again to remove '+plural(n,'player') : 'Remove selected')+'</button>'
    + (armed ? '<span class="sub">Removes them from the '+esc(snameOf(STATE.seasonId))
             + ' only - careers and other seasons are kept. A player with stats this '
             + 'season is refused.</span>' : '');
}

function selBarRefresh(){
  var el = document.getElementById('selBar');
  if (el) el.innerHTML = selBarHtml();
}

INP.rosSel = function(el){
  var ps = el.getAttribute('data-ps');
  if (el.checked) STATE.sel[ps] = true; else delete STATE.sel[ps];
  STATE.armRemove = false;
  selBarRefresh();
};
INP.rosSelAll = function(el){
  STATE.sel = {};
  if (el.checked)
    STATE.roster.roster.forEach(function(p){ STATE.sel[p.playerSeasonId] = true; });
  STATE.armRemove = false;
  document.querySelectorAll('input[data-h="rosSel"]').forEach(function(x){
    x.checked = el.checked;
  });
  selBarRefresh();
};

ACT.rosRemove = function(){
  var ids = Object.keys(STATE.sel);
  if (!ids.length) return;
  if (!STATE.armRemove){ STATE.armRemove = true; selBarRefresh(); return; }
  STATE.armRemove = false;

  busy(true, 'Removing...');
  call('svcDeletePlayers', [STATE.teamId, STATE.seasonId, ids]).then(function(r){
    busy(false);
    STATE.roster = null; STATE.sel = {}; clearDirty();
    if (r.refused && r.refused.length){
      noticeBox('bad', refusalHtml(r.refused));
      flash('Removed '+r.removed+'. '+plural(r.refused.length,'refusal')+' above.', 'err');
    } else {
      noticeBox('', '');
      flash('Removed '+plural(r.removed,'player')+' from this season\u2019s roster.', 'good');
    }
    viewRoster();
  }).catch(function(e){
    busy(false);
    barMsg(msgOf(e), 'err');
  });
};

/* - adding - */

/* First and last are typed apart - one box for "Name" invites "Smith, John",
   nicknames, and a school pasted in - and joined only at the send. */
INP.addFirst  = function(el){ STATE.add = STATE.add || {positions:[]}; STATE.add.first = el.value; };
INP.addLast   = function(el){ STATE.add = STATE.add || {positions:[]}; STATE.add.last = el.value; };
INP.addGrad   = function(el){ STATE.add = STATE.add || {positions:[]}; STATE.add.grad = readText(el); };
INP.addJersey = function(el){ STATE.add = STATE.add || {positions:[]}; STATE.add.jersey = readText(el); };

ACT.rosAdd = function(el){
  var a = STATE.add || {positions:[]};
  var msg = document.getElementById('addMsg');
  function say(t, bad){ if (msg){ msg.textContent = t; msg.className = 'sub'+(bad?' err':''); } }
  var full = (String(a.first||'').trim()+' '+String(a.last||'').trim()).trim();
  if (!String(a.first||'').trim() || !String(a.last||'').trim()){
    say('First and last name are both required.', true); return; }
  if (!a.positions.length){ say('Pick at least one position.', true); return; }

  el.disabled = true;
  say('Adding...');
  call('svcAddPlayer', [STATE.teamId, STATE.seasonId, {
    name: full, grad: a.grad, jersey: a.jersey, positions: a.positions
  }]).then(function(){
    STATE.add = null;
    STATE.roster = null;
    flash('Added '+full+'.', 'good');
    viewRoster();
  }).catch(function(e){
    el.disabled = false;
    say(msgOf(e), true);
  });

function countIncomplete(){
  var n = STATE.roster.roster.filter(function(p){ return !p.positions.length; }).length;
  if (n) alertBox('', '<b>'+plural(n,'player')+'</b> have no position selected. They will '
    + 'not appear in All-Conference rankings until you set one.');
  else alertBox('ok', 'Every player has at least one position. All-Conference eligibility is '
    + 'complete for this roster.');
}

function rosterRow(ps){
  return STATE.roster.roster.filter(function(x){ return x.playerSeasonId === ps; })[0];
}

INP.ros = function(el){
  var p = rosterRow(el.getAttribute('data-ps'));
  if (!p) return;
  var k = el.getAttribute('data-k');
  // A jersey is text because "00" is a number a player wears; blank clears it
  // rather than making him number nought.
  p[k] = (k === 'jersey') ? (readText(el) || null) : readNum(el);
  markDirty(p.playerSeasonId);
  var tr = el.closest ? el.closest('tr') : null;
  if (tr) tr.className = rosterRowClass(p);
};

/* the height pair: both boxes report through the same handler */
INP.rosHt = function(el){
  var p = rosterRow(el.getAttribute('data-ps'));
  if (!p) return;
  p.heightInches = readFtIn(el);
  markDirty(p.playerSeasonId);
  var tr = el.closest ? el.closest('tr') : null;
  if (tr) tr.className = rosterRowClass(p);
};

/* grad, commitment and level are text, not numbers - readNum would turn a
   commitment of "Towson University" into null and call that an edit */
INP.rosTxt = function(el){
  var p = rosterRow(el.getAttribute('data-ps'));
  if (!p) return;
  p[el.getAttribute('data-k')] = el.value;
  markDirty(p.playerSeasonId);
  var tr = el.closest ? el.closest('tr') : null;
  if (tr) tr.className = rosterRowClass(p);
};

function saveRoster(){
  var ids = Object.keys(dirtySet());
  var meas = rosterMeasurables();
  var edits = STATE.roster.roster.filter(function(p){ return ids.indexOf(p.playerSeasonId) >= 0; })
    .map(function(p){
      var e = { playerSeasonId: p.playerSeasonId, positions: p.positions,
                jersey: p.jersey, grad: p.grad,
                commitment: p.commitment, commitmentLevel: p.commitmentLevel };
      meas.forEach(function(m){ e[m.key] = p[m.key]; });
      return e;
    });
  var captDirty = !!dirtySet()['__captains'];
  if (!edits.length && !captDirty) return;

  if (captDirty && STATE.capt.length > (STATE.roster.maxCaptains || 8)){
    barMsg(plural(STATE.capt.length,'captain')+' selected; the limit is '
           + (STATE.roster.maxCaptains || 8) + '.', 'err');
    return;
  }

  busy(true, 'Saving...');
  var step = edits.length
    ? call('svcSaveRoster', [STATE.teamId, STATE.seasonId, edits])
    : Promise.resolve({ saved: 0, refused: [] });

  step.then(function(r){
    /* Captains save through their own endpoint - the list is all-or-nothing on
       the server, so it rides after the row edits and reports its own refusal
       without taking theirs down. */
    var next = captDirty
      ? call('svcSetCaptains', [STATE.teamId, STATE.seasonId, STATE.capt])
          .then(function(){ return ''; })
          .catch(function(e){ return msgOf(e); })
      : Promise.resolve('');
    return next.then(function(captErr){
      busy(false);
      var problems = (r.refused || []).slice();
      if (captErr) problems.push('Captains: ' + captErr);

      if (problems.length){
        keepRefused(ids, r.refused || []);
        if (captErr) markDirty('__captains');
        noticeBox('bad', refusalHtml(problems));
        // "above" is only true if it is on the screen; a long roster puts the
        // list of refusals several screens up from the save bar that names it
        noticeSeen();
        flash('Saved '+r.saved+(captDirty && !captErr ? ' and the captain list' : '')
              +'. '+plural(problems.length,'problem')+' above.', 'err');
      } else {
        clearDirty();
        STATE.capt = null;         // re-derived from the sheet on the next read
        STATE.roster = null;
        noticeBox('', '');
        flash('Saved '+plural(r.saved,'player')
              +(captDirty ? ' and the captain list' : '')
              +'. Rankings recompute within fifteen minutes.', 'good');
        viewRoster();
        return;
      }
      renderRoster();
    });
  }).catch(function(e){
    busy(false);
    /* The save bar carries a single line; a server refusal is a sentence worth
       reading in full, and losing it is how an edit goes missing without a
       word. Both, and scrolled to if need be. */
    barMsg(msgOf(e), 'err');
    noticeBox('bad', '<b>Not saved.</b> '+esc(msgOf(e)));
    noticeSeen();
  });
}

/* The C column. Toggles buffer into STATE.capt and save with the roster -
   captains stopped being their own tab because naming one is a roster fact,
   not a separate chore. */
INP.rosCapt = function(el){
  var pid = el.getAttribute('data-pid');
  var i = STATE.capt.indexOf(pid);
  if (el.checked && i < 0) STATE.capt.push(pid);
  if (!el.checked && i >= 0) STATE.capt.splice(i, 1);
  markDirty('__captains');
  var max = (STATE.roster && STATE.roster.maxCaptains) || 8;
  if (STATE.capt.length > max)
    barMsg(plural(STATE.capt.length,'captain')+' selected; the limit is '+max+'.', 'err');
  else barMsg(plural(STATE.capt.length,'captain')+' selected.', '');
};

/* -
   TEAM ADMIN - one payload behind Scores, Stat entry, Captains, Links, Approvals
   - */

function loadTeamAdmin(){

/* - Scores - */

function viewScores(){
  withTeamAdmin(function(d){
    var rows = d.games.map(function(g){
      var st = g.status ? String(g.status).toUpperCase() : 'SCHEDULED';
      var id = esc(g.id);
      return '<tr class="'+(dirtySet()[g.id]?'dirty':'')+'" data-g="'+id+'">'
        + '<td class="sub">'+num(g.week)+'</td>'
        + '<td><div class="nm">'+(g.isHome?'vs ':'at ')+esc(g.opponentName)+'</div>'
        + '<div class="sub">'+esc(dateShort(g.date))
        + (g.statRows?' · '+plural(g.statRows,'stat line'):'')+'</div></td>'
        + '<td><input type="number" class="sm" data-h="scr" data-k="team" data-g="'+id+'" value="'+cell(g.teamScore)+'"></td>'
        + '<td><input type="number" class="sm" data-h="scr" data-k="opp" data-g="'+id+'" value="'+cell(g.opponentScore)+'"></td>'
        + '<td><select data-h="scr" data-k="status" data-g="'+id+'">'
        + d.editable.statuses.map(function(x){
            return '<option value="'+esc(x)+'"'+(x===st?' selected':'')+'>'+esc(x)+'</option>';
          }).join('')
        + '</select>'
        /* A forfeit is decided by who forfeited, not by a score, so the status
           brings its own question. The sides are named as the standings read
           them - HOME or AWAY - and shown as the two schools.
           The question lives in a wrapper of its own, hidden as a whole: the
           page dresses every select in a styled control beside it, and hiding
           the bare select left the control standing on every row. */
        + '<div data-fbwrap="'+id+'" style="margin-top:6px"'+(st==='FORFEIT'?'':' hidden')+'>'
        + '<select data-h="scr" data-k="forfeit" data-g="'+id+'" aria-label="Who forfeited">'
        + '<option value="">Who forfeited?</option>'
        + '<option value="'+(g.isHome?'AWAY':'HOME')+'"'+(g.forfeitBy===(g.isHome?'AWAY':'HOME')?' selected':'')+'>'
        + esc(g.opponentName)+' forfeited</option>'
        + '<option value="'+(g.isHome?'HOME':'AWAY')+'"'+(g.forfeitBy===(g.isHome?'HOME':'AWAY')?' selected':'')+'>'
        + esc(d.team.name)+' forfeited</option>'
        + '</select></div></td></tr>';
    }).join('');

    paint('<div class="card"><h2>Results · '+esc(snameOf(STATE.seasonId))+'</h2>'
      + '<div class="sub" style="margin-bottom:12px">Leave both boxes empty until the game '
      + 'has been played. An empty box means <b>not played</b>; a 0 means the team was held '
      + 'scoreless, and the standings, the point differential and every per-game average '
      + 'believe whichever one you type. '
      + 'For a <b>forfeit</b>, set the status and say who forfeited - no score is needed; '
      + 'the win is recorded from that.'
      + (d.editable.forfeitIsAdminOnly
          ? ' You can record a forfeit but you cannot record one away - a forfeit is a '
            + 'conference ruling, not a scorekeeping detail, so only an administrator can '
            + 'change one back.' : '')
      + '</div>'
      + '<div class="scroll"><table><thead><tr>'
      + '<th style="width:50px">Wk</th><th>Opponent</th>'
      + '<th style="width:92px">'+esc(d.team.name)+'</th>'
      + '<th style="width:92px">Opponent</th>'
      + '<th style="width:200px">Status</th></tr></thead><tbody>'
      + (rows || '<tr><td colspan="5" class="sub">No games on the schedule for '
         + esc(snameOf(STATE.seasonId))+'.</td></tr>')
      + '</tbody></table></div></div>');

    alertBox('', '');
    barShow({ label:'Save scores', save:saveScores, reset:function(){
      STATE.ta = null; clearDirty(); viewScores(); } });
  });
}

function gameRowOf(id){
  return STATE.ta.games.filter(function(g){ return g.id === id; })[0];
}

INP.scr = function(el){
  var g = gameRowOf(el.getAttribute('data-g'));
  if (!g) return;
  var k = el.getAttribute('data-k');
  var tr = el.closest ? el.closest('tr') : null;
  if (k === 'status'){
    g.status = el.value;
    // the who-forfeited question appears with the status that needs it
    var fb = tr ? tr.querySelector('[data-fbwrap]') : null;
    if (fb) fb.hidden = (String(g.status).toUpperCase() !== 'FORFEIT');
  }
  else if (k === 'forfeit') g.forfeitBy = el.value;
  else if (k === 'team') g.teamScore = readNum(el);
  else g.opponentScore = readNum(el);
  markDirty(g.id);
  if (tr) tr.className = 'dirty';
};

function saveScores(){
  var ids = Object.keys(dirtySet());
  if (!ids.length) return;
  busy(true, 'Saving '+plural(ids.length,'game')+'--');

  var ok = 0, failed = {}, notes = [];
  // One game per call, in sequence. A save holds the script lock for its whole
  // length, so firing fifteen at once would leave fourteen waiting on it.
  var chain = Promise.resolve();
  ids.forEach(function(id){
    chain = chain.then(function(){
      var g = gameRowOf(id);
      if (!g) return;
      var hs = g.isHome ? g.teamScore : g.opponentScore;
      var as = g.isHome ? g.opponentScore : g.teamScore;
      var forfeit = String(g.status||'').toUpperCase() === 'FORFEIT';
      // a forfeit naming nobody is the one the standings skip: refused here,
      // in the row's own words, before a round trip says the same
      if (forfeit && !g.forfeitBy){
        failed[id] = true;
        notes.push((g.isHome?'vs ':'at ') + g.opponentName + ': who forfeited? Pick the team that did not play.');
        return;
      }
      return call('svcSaveGameScore', [id, hs, as, g.status, forfeit ? g.forfeitBy : '']).then(function(r){
        ok++;
        g.hs = r.homeScore; g.as = r.awayScore; g.status = r.status;
        g.forfeitBy = r.forfeitBy || '';
        g.teamScore     = g.isHome ? r.homeScore : r.awayScore;
        g.opponentScore = g.isHome ? r.awayScore : r.homeScore;
      }).catch(function(e){
        failed[id] = true;
        notes.push((g.isHome?'vs ':'at ') + g.opponentName + ': ' + msgOf(e));
      });
    });
  });

  chain.then(function(){
    busy(false);
    setDirty(failed);
    if (notes.length){
      noticeBox('bad', refusalHtml(notes));
      flash('Saved '+ok+'. '+plural(notes.length,'game')+' refused.', 'err');
    } else {
      noticeBox('', '');
      flash('Saved '+plural(ok,'game')+'. Standings recompute within fifteen minutes.', 'good');
    }
    viewScores();
  });
}

/* - Stat entry - */

/* The key apiGame() reports each measure under. It projects sixteen of the
   thirty-two, so every other column loads empty - which is exactly why only a
   box somebody touched is ever sent: a partial read must not be able to clear a

  RushAtt:'Att', RushYds:'Yds', RushTD:'TD', RushFum:'Fum',
  Rec:'Rec', RecYds:'Yds', RecTD:'TD', RecFum:'Fum',
  TackleSolo:'Solo', TackleAssist:'Asst', TFL:'TFL', Sacks:'Sacks',
  Int:'INT', FF:'FF', FR:'FR', PassDef:'PD', DefTD:'TD',
  FGM:'FGM', FGA:'FGA', XPM:'XPM', XPA:'XPA', Punts:'Punts', PuntYds:'Punt yds',
  KR:'KR', KRYds:'KR yds', PR:'PR', PRYds:'PR yds'
};

/* The same measures spelled out, for a player choosing one to dispute and for
   every tooltip. Int and PassInt are opposite sides of one play and the short
   labels cannot carry that. Anything unlisted falls back to its column name. */
var FIELD_LONG = {
  PassAtt:'Pass attempts', PassComp:'Completions', PassYds:'Passing yards',
  PassTD:'Passing touchdowns', PassInt:'Interceptions thrown',
  RushAtt:'Rush attempts', RushYds:'Rushing yards', RushTD:'Rushing touchdowns',
  RushFum:'Fumbles rushing', Rec:'Receptions', RecYds:'Receiving yards',

/* The submission history at the foot of Stat Entry: this school's weeks,
   the four boxes and the verdict, from the same tracker the administrator
   reads conference-wide. Drawn from what is held, fetched when stale, and
   swapped in place when it arrives - the box score above is never redrawn
   for it. */
function historyCard(){
  var key = STATE.teamId + '|' + STATE.seasonId;
  var fresh = STATE.history && STATE.history.key === key && STATE.history.data;
  if (!fresh) refreshHistory();
  return '<div id="historyCard">'
    + (fresh ? dashTracker(STATE.history.data, 'Submission history') : loadingCard('Loading submission history', 2))
    + '</div>';
}
function refreshHistory(){
  var key = STATE.teamId + '|' + STATE.seasonId;
  if (STATE.historyBusy === key) return;
  STATE.historyBusy = key;
  call('svcStatsTracker', [STATE.seasonId, STATE.teamId])
    .then(function(tr){ return tr; }, function(e){ return { error: msgOf(e) }; })
    .then(function(tr){
      STATE.historyBusy = null;
      STATE.history = { key: key, data: tr };
      var el = document.getElementById('historyCard');
      if (el && STATE.view === 'stats'){ el.innerHTML = dashTracker(tr, 'Submission history'); enhanceUI(el); }
    });
}

/* a game's line on either picker: the week, the opponent, what is filed */
function gameLabel(g){
  return 'Week ' + (g.week===null?'?':g.week) + ' · ' + (g.isHome?'vs ':'at ') + g.opponentName + ' · '
    + (g.statRows ? plural(g.statRows,'line')+' filed' : 'nothing filed');
}
/* the games a stats file can be uploaded for: every one already played -
   its day has come, or a score is on it. The future has no stats. */
function uploadableGames(d){
  var t = new Date();
  var today = t.getFullYear()+'-'+('0'+(t.getMonth()+1)).slice(-2)+'-'+('0'+t.getDate()).slice(-2);
  var past = d.games.filter(function(g){
    var scored = g.teamScore !== null && g.teamScore !== undefined && g.teamScore !== '';
    return scored || !g.date || String(g.date) <= today;
  });
  return past;
}

/* The short road for a coach whose stats live in a spreadsheet, a PDF or a
   phone photo, first on the page and never in the way: pick any game already
   played, send the file. It is read on the spot and every line that matches
   the roster lands on that game's box score as official - nothing to
   approve, and a later upload replaces it. The administrators get the file
   too, so nothing read wrongly is the last word. */
function uploadCard(d){
  var games = uploadableGames(d);
  var sel = STATE.sfGame || (STATE.box ? STATE.box.gameId : '');
  if (sel && !games.some(function(g){ return g.id === sel; })) sel = '';
  var msg = STATE.sfMsg || (sel ? '' : 'Pick the game first.');
  STATE.sfMsg = '';
  return '<div class="card" id="sfCard"><h2>Upload a stats file</h2>'
    + '<ul class="rules">'
    + '<li>A spreadsheet, PDF, Word file or a photo of the sheet, up to 7 MB.</li>'
    + '<li>Any game already played.</li>'
    + '<li>Read automatically. Lines matched to your roster land on the box score as official - nothing to approve.</li>'
    + '<li>Upload again any time. The newest upload replaces the last.</li>'
    + '<li>Names it cannot match go to the administrators with the file.</li>'
    + '</ul>'
    + '<div class="row" style="flex-wrap:wrap">'
    + '<select data-h="sfGame" aria-label="Game for the file" style="max-width:360px"><option value="">Which game?</option>'
    + games.map(function(g){
        return '<option value="'+esc(g.id)+'"'+(sel===g.id?' selected':'')+'>'+esc(gameLabel(g))+'</option>'; }).join('')
    + '</select>'
    + '<input type="file" id="sfFile" accept="image/*,.pdf,.csv,.txt,.xlsx,.xls,.docx,.doc">'
    + '<button type="button" class="mini primary" data-a="sfSend"'+(sel?'':' disabled')+'>Upload and read it</button>'
    + '<span class="sub grow" id="sfMsg">'+esc(msg)+'</span></div>'
    + (games.length ? '' : '<div class="sub" style="margin-top:8px">No game has been played yet this season.</div>')
    + '</div>';
}
INP.sfGame = function(el){
  STATE.sfGame = el.value;
  var btn = document.querySelector('[data-a="sfSend"]'), m = document.getElementById('sfMsg');
  if (btn) btn.disabled = !el.value;

function renderBox(d){

  h += uploadCard(d);

  h += '<div class="card"><h2>Which game?</h2>'
    + '<div class="sub" style="margin-bottom:8px">Enter or correct a box score by hand.</div>'
    + '<select data-h="boxGame"><option value="">Choose a game...</option>'
    + d.games.map(function(g){
        return '<option value="'+esc(g.id)+'"'+(b && b.gameId===g.id?' selected':'')+'>'
             + esc(gameLabel(g))+'</option>'; }).join('')
    + '</select></div>';

  if (!b){
    paint(h + '<div class="card sub">Pick a game to enter or correct its box score. '
      + 'Everything is recorded game by game, which is what lets a season total be summed '
      + 'rather than typed.</div>' + historyCard());
    barHide();
    alertBox('', '');
    return;
  }

  var cats = d.editable.categories;
  var cat = cats.filter(function(c){ return c.category === b.cat; })[0] || cats[0];
  b.cat = cat.category;
  var fields = cat.fields;
  var lines = b.lines[b.cat] || [];
  var half = d.editable.halfFields || [];
  var unknown = fields.filter(function(f){ return !BOX_KEY[f]; });

  h += '<div class="card"><div class="tabs" style="margin-bottom:12px">'
    + cats.map(function(c){
        var n = (b.lines[c.category] || []).length;
        return '<button type="button" data-a="boxCat" data-cat="'+esc(c.category)+'" class="'
          + (b.cat===c.category?'on':'')+'">'+esc(c.category)
          + (n?'<span class="badge quiet">'+n+'</span>':'')+'</button>';
      }).join('')
    + '</div>';

  h += '<div class="scroll"><table><thead><tr><th style="width:190px">Player</th>'
    + fields.map(function(f){
        return '<th class="num" title="'+esc(fieldLong(f))+'">'
             + esc(FIELD_LABEL[f]||f)+'</th>'; }).join('')
    + '</tr></thead><tbody>';

  if (!lines.length){
    h += '<tr><td colspan="'+(fields.length+1)+'" class="sub">No '+esc(b.cat)
       + ' lines for this game yet. Add a player below.</td></tr>';
  }
  lines.forEach(function(ln, i){
    if (!ln.playerId){
      // An imported line that never resolved to a player has nothing to key an
      // update on, so it is shown and left alone rather than half-edited.
      h += '<tr><td><div class="nm">'+esc(ln.name || 'unnamed')+'</div>'
        + '<div class="sub">Imported without a player id, so it cannot be edited here.</div></td>'
        + fields.map(function(f){ return '<td class="num sub">'+num(ln.existing[f])+'</td>'; }).join('')
        + '</tr>';
      return;
    }
    h += '<tr class="'+(Object.keys(ln.edits).length?'dirty':'')+'">'
      + '<td><div class="nm">'+esc(ln.name)+'</div>'
      + (ln.isNew?'<div class="sub">new line</div>':'')+'</td>'
      + fields.map(function(f){
          var known = !!BOX_KEY[f];
          var v = (ln.edits[f] !== undefined) ? ln.edits[f] : ln.existing[f];
          return '<td><input type="number" class="stat'+(known?'':' unknown')+'"'
            + (half.indexOf(f)>=0 ? ' step="0.5"' : ' step="1"')
            + ' data-h="boxCell" data-i="'+i+'" data-f="'+esc(f)+'"'
            + ' title="'+esc(fieldLong(f))
            + (known ? '' : ' - not shown by the box-score read; leave it alone and it is '
                          + 'not changed')
            + '" value="'+cell(v)+'"></td>'; }).join('')
      + '</tr>';
  });
  h += '</tbody></table></div>';

  var avail = d.roster.filter(function(p){
    return !lines.some(function(l){ return l.playerId === p.playerId; });
  });
  h += '<div class="row" style="margin-top:12px">'
    + '<select data-h="boxAdd" style="max-width:300px">'
    + '<option value="">Add a player to '+esc(b.cat)+'--</option>'
    + avail.map(function(p){
        return '<option value="'+esc(p.playerId)+'">'
             + (p.jersey!=='' ? '#'+esc(p.jersey)+' ' : '')+esc(p.name)+'</option>'; }).join('')
    + '</select>'
    + '<span class="sub grow">Only players on this season&rsquo;s roster can appear in a box '
    + 'score.</span></div>';

  h += '<div class="sub" style="margin-top:12px">An empty box is left exactly as it is. To '
    + 'record that something did not happen, type <b>0</b>; to take a number back out, clear '
    + 'the box you typed it into. A blank means nobody reported it, which is not the same '
    + 'claim as a zero.';
  if (unknown.length){
    h += '<br><br>These columns load empty because the box-score read does not return them: '
      + '<b>'+esc(unknown.map(fieldLong).join(', '))+'</b>. Whatever is on file for them is '
      + 'still there - leave them alone and nothing changes.';
  }
  h += '</div></div>';

  paint(h + historyCard());
  alertBox('', '');
  barShow({ label:'Save box score', save:saveBox, reset:function(){
    var gid = b.gameId;
    STATE.box = null; STATE.ta = null; clearDirty();
    withTeamAdmin(function(d2){ if (gid) loadBox(gid); else renderBox(d2); });
  } });
}

INP.boxGame = function(el){
  var gid = el.value;
  if (STATE.boxLoading === gid) return;      // input and change both fire
  STATE.boxLoading = gid;
  if (!gid){ STATE.box = null; clearDirty(); renderBox(STATE.ta); return; }
  if (STATE.box && STATE.box.gameId === gid) return;
  loadBox(gid);
};

function loadBox(gameId){
  paintLoading('Loading the box score',5);
  clearDirty();
  STATE.boxLoading = gameId;
  call('svcGame', [gameId]).then(function(g){
    var byCat = {};
    STATE.ta.editable.categories.forEach(function(c){ byCat[c.category] = []; });
    ((g && g.stats && g.stats[STATE.teamId]) || []).forEach(function(x){
      if (!byCat[x.cat]) byCat[x.cat] = [];
      var existing = {};
      Object.keys(BOX_KEY).forEach(function(f){
        var v = x[BOX_KEY[f]];
        if (v !== undefined && v !== null && v !== '') existing[f] = v;
      });
      byCat[x.cat].push({ playerId: x.playerId, name: x.name, existing: existing,
                          edits: {}, isNew: false });
    });
    STATE.box = { gameId: gameId, teamId: STATE.teamId,
                  cat: STATE.ta.editable.categories[0].category, lines: byCat };
    STATE.boxLoading = null;
    renderBox(STATE.ta);
  }).catch(function(e){
    STATE.boxLoading = null;
    STATE.box = null;
    alertBox('bad', esc(msgOf(e)));
    renderBox(STATE.ta);
  });
}

ACT.boxCat = function(el){
  if (!STATE.box) return;
  STATE.box.cat = el.getAttribute('data-cat');
  renderBox(STATE.ta);
};

INP.boxAdd = function(el){
  var pid = el.value;
  el.value = '';                             // input and change both fire
  if (!pid || !STATE.box) return;
  var p = STATE.ta.roster.filter(function(x){ return x.playerId === pid; })[0];
  if (!p) return;
  (STATE.box.lines[STATE.box.cat] = STATE.box.lines[STATE.box.cat] || [])
    .push({ playerId: p.playerId, name: p.name, existing: {}, edits: {}, isNew: true });
  renderBox(STATE.ta);
};

INP.boxCell = function(el){
  if (!STATE.box) return;
  var ln = (STATE.box.lines[STATE.box.cat] || [])[Number(el.getAttribute('data-i'))];
  if (!ln) return;
  // Only a box somebody touched is ever sent. An untouched field is absent from
  // the payload, and the server leaves an absent field exactly as it is.
  ln.edits[el.getAttribute('data-f')] = readNum(el);
  markDirty(STATE.box.cat + '|' + ln.playerId);
  var tr = el.closest ? el.closest('tr') : null;
  if (tr) tr.className = 'dirty';
};

function saveBox(){
  var b = STATE.box;
  if (!b) return;
  var send = [], keys = [], skipped = [];

  Object.keys(b.lines).forEach(function(cat){
    b.lines[cat].forEach(function(ln){
      if (!ln.playerId) return;
      var touched = Object.keys(ln.edits);
      if (!touched.length) return;
      var allBlank = touched.every(function(f){ return ln.edits[f] === null; });
      // A brand new line holding nothing but blanks would append a stat row with
      // no statistics in it, and that row would then count as an appearance in
      // his games played and drag every per-game average down with it.
      if (ln.isNew && allBlank && !Object.keys(ln.existing).length){
        skipped.push(ln.name + ' (' + cat + '): every box was left empty, so no line was created.');
        return;
      }
      var row = { playerId: ln.playerId, category: cat };
      touched.forEach(function(f){ row[f] = ln.edits[f]; });
      send.push(row);
      keys.push(cat + '|' + ln.playerId);
    });
  });

  if (!send.length){
    clearDirty();
    if (skipped.length){ noticeBox('', refusalHtml(skipped)); barMsg('Nothing to save.', ''); }
    return;
  }
  if (send.length > STATE.ta.editable.maxStatRows){
    noticeBox('bad', 'That is '+send.length+' stat lines in one save; the limit is '
      + STATE.ta.editable.maxStatRows+'. Save one category, then the next.');
    return;
  }

  busy(true, 'Saving '+plural(send.length,'stat line')+'--');
  call('svcSavePlayerStats', [b.gameId, STATE.teamId, send]).then(function(r){
    busy(false);
    var notes = (r.refused || []).slice();

    // The server labels a refusal "row N", counting from one, in the order sent.
    var failed = {};
    notes.forEach(function(line){
      var m = /^row (\d+)/.exec(String(line));
      if (m && keys[Number(m[1]) - 1]) failed[keys[Number(m[1]) - 1]] = true;
    });
    if (notes.length && !Object.keys(failed).length)
      keys.forEach(function(k){ failed[k] = true; });      // unattributable: hold it all

    // Whatever saved is now on file, so it stops being an unsent edit.
    Object.keys(b.lines).forEach(function(cat){
      b.lines[cat].forEach(function(ln){
        if (!ln.playerId || failed[cat + '|' + ln.playerId]) return;
        Object.keys(ln.edits).forEach(function(f){
          if (ln.edits[f] === null) delete ln.existing[f];
          else ln.existing[f] = ln.edits[f];
        });
        ln.edits = {};
        if (Object.keys(ln.existing).length) ln.isNew = false;
      });
    });

    notes = notes.concat(skipped);
    setDirty(failed);
    if (notes.length){
      noticeBox('bad', refusalHtml(notes));
      flash('Saved '+plural(r.saved,'line')+'. '+plural(notes.length,'refusal')+'.', 'err');
    } else {
      noticeBox('', '');
      flash('Saved '+plural(r.saved,'line')+'. Totals recompute within fifteen minutes.', 'good');
    }
    // the history at the foot of the page counts what was just saved
    if (r.saved){ STATE.history = null; refreshHistory(); }

    STATE.ta = null;                        // the filed-line counts have moved
    withTeamAdmin(renderBox);
  }).catch(function(e){
    busy(false);
    barMsg(msgOf(e), 'err');
  });
}

function viewApprovals(){
  var isCurrent=portalViewCurrent();
  paintLoading('Loading approvals',4);
  barHide();
  alertBox('', '');
  Promise.all([
    loadTeamAdmin(),
    // A coach with no pending queue is not an error, and a thrown "coaches only"
    // must not take the corrections list down with it.
    call('svcPendingAccounts').catch(function(){if(!isCurrent())return; return { pending: [], totals: null }; }),
    call('svcPendingPlayerStats').catch(function(){if(!isCurrent())return; return []; }),
    /* Corrections come from their own endpoint, scoped by role, NOT from the
       team payload: an administrator's badge counts the whole conference and
       his list has to match it. Asking svcTeamAdmin would show him only the
       school in the picker. */
    call('svcPendingCorrections').catch(function(){if(!isCurrent())return; return null; })
  ]).then(function(r){if(!isCurrent())return;
    var pa = r[1] || {};
    STATE.pending = pa.pending || [];
    STATE.acctTotals = pa.totals || null;
    STATE.pendStats = r[2] || [];
    // null means the call failed outright; fall back to the team payload's own
    STATE.pendCorr = r[3] || null;
    renderApprovals(r[0], STATE.pending);
  }).catch(function(e){if(!isCurrent())return;
    alertBox('bad', esc(msgOf(e)));
    paint('<div class="card sub">Unavailable.</div>');
  });
}

      + 'and the totals catch up on the next rebuild, rejecting leaves the published number '
      + 'exactly where it is. He is told which, either way.'
      + (a.isAdmin ? ' Every school is here, whichever one the picker is on.' : '')+'</div>'

               and the server has already said so by the time this is drawn.
               Offering Approve anyway spends a click to buy an error message.
               Reject stays: a request can be turned down whatever the sheet
               holds. */
            + (!c.blocked
                ? '<button type="button" class="mini primary" data-a="coYes" data-id="'+id+'">Approve</button>'
                : (c.addable
                    /* He has no line in that game at all. Approving can still

  /* - player-entered stats -
     Live on the site in grey. Approve turns them black; reject deletes them;
     entering the official box score in Stat Entry replaces them without
     touching this queue. */
  var ps = STATE.pendStats || [];

          + '<button type="button" class="mini danger" data-a="psNo" data-g="'+esc(g.gameId)+'" data-p="'+esc(g.playerId)+'">Reject</button>'

      }).join('')
      + '<div class="sub">Approving keeps the numbers exactly as entered and turns them '
      + 'black across the site. Rejecting removes them entirely and tells the player. '
      + 'Entering the official box score yourself replaces them without this queue.</div>';

  paint(h);

/* - deciding one item in a queue -

   Three queues behave the same way and all three used to lose their answer.
   The outcome went to #notice, which sits above the whole view: a queue runs
   down the screen, so somebody deciding the fifth request read a sentence
   several screens above him and saw nothing. Worse, a REFUSAL - the server
   answering {ok:false}, "already ACTIVE", "not authorized" - still triggered
   the full repaint, so the list came back with the request still in it and no
   word about why. Clicked, reset, nothing happened.

   Now the answer is printed in the card whose button was pressed, the repaint
   happens only when the decision actually took, and a refusal leaves the card
   and its reason on screen to be read. */

function reqCardOf(el){ return (el && el.closest) ? el.closest('.req') : null; }

/** Print an outcome inside a card, and hand back whether there was one. */
function reqNote(el, kind, html){
  var card = reqCardOf(el);
  if (!card) return false;
  var line = card.querySelector('.req-note');
  if (!line){
    line = document.createElement('div');
    line.className = 'req-note';
    line.setAttribute('role', kind === 'bad' ? 'alert' : 'status');
    card.appendChild(line);
  }
  line.className = 'req-note ' + (kind || '');
  line.innerHTML = html || '';
  return true;
}

/** Buttons off, the card greyed: this one is answered and going away. */
function reqSettled(el, html){
  var card = reqCardOf(el);
  if (card){
    card.className = 'req settled';
    card.querySelectorAll('button').forEach(function(b){ b.disabled = true; });
  }
  reqNote(el, 'ok', html);
}

/**
 * The shared shape of a decision.
 *  run   - returns the promise for the call
 *  ok    - what to clear and do when the server says it took
 * A false `ok` from the server is a refusal, not a success: say so where the
 * click was and leave everything else alone.
 */
function decideItem(el, run, onOk){
  el.disabled = true;
  noticeBox('', '');
  run().then(function(r){
    var took = !!(r && r.ok !== false);
    var msg = esc((r && r.message) || (took ? 'Done.' : 'Nothing was changed.'));
    if (!took){
      el.disabled = false;
      noticeBox('bad', '<b>'+msg+'</b>');
      if (!reqNote(el, 'bad', '<b>'+msg+'</b>')) noticeSeen();
      return;
    }
    reqSettled(el, '<b>'+msg+'</b>');
    noticeBox('ok', '<b>'+msg+'</b>');
    onOk();
  }).catch(function(e){
    el.disabled = false;
    var msg = esc(msgOf(e));
    noticeBox('bad', '<b>'+msg+'</b>');
    if (!reqNote(el, 'bad', '<b>'+msg+'</b>')) noticeSeen();
  });
}
